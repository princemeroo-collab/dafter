 <div><label class="f">نوع النشاط</label><select class="in" id="at">${AI_TYPES.map(t=>`<option value="${t[0]}" ${t[0]===sub?'selected':''}>${t[1]}</option>`).join('')}</select></div>
 ${lessonSelect(key,code,{id:'ac'})}</div>
 <label class="f" style="margin-top:10px">ماذا تريدين؟ (اختياري — هدف معين، فكرة، مستوى الطلاب…)</label><textarea class="in" id="ar" placeholder="مثال: لعبة لمطابقة أجزاء الحاسوب بصورها، أو نشاط علاجي لطلاب يخلطون بين النقر والنقر المزدوج">${esc(request)}</textarea>
 <label class="row small" style="margin-top:6px"><input type="checkbox" id="aimg" ${SAMPLE_IMG?'checked':'disabled'}> الاعتماد على صور صفحات الكتاب والدليل للدرس ${SAMPLE_IMG?'':'(غير متاح)'}</label>
 <label class="row small dzopt" style="margin-top:6px"><input type="checkbox" id="adz" checked> <b>🎨 تصميم نشاط تفاعلي كامل (صفحة HTML مصممة بجودة عالية للشاشة التفاعلية)</b></label>
 <div id="out" style="margin-top:14px"></div>`,foot:`<button class="btn ai-btn" id="gen">✨ اقترح</button>`});
 const E=m.el;let result=null;
 $('#gen',E).onclick=async()=>{const b=$('#gen',E);b.disabled=true;b.innerHTML='<span class="spin"></span> يفكّر…';
  const type=$('#at',E).value,c=$('#ac',E).value,cls=null;
  $('#out',E).innerHTML='<div class="act-card"><span class="spin"></span> جارٍ إعداد النشاط'+($('#aimg',E).checked&&c?' بالاعتماد على صفحات الكتاب':'')+'…</div>';
  if($('#adz',E)?.checked){try{const d=await aiDesign({key,code:c,request:$('#ar',E).value.trim(),type});
   const it={id:uid('item'),kind:'item',lib:'interactive',sub:['prior','intro','formative','closing'].includes(type)?type:'game',key,code:c,title:d.title,html:d.html,images:d.files,files:[],links:[],quiz:[],created:Date.now(),ai:true};
   Store.save(it);onSaved&&onSaved();
   $('#out',E).innerHTML=`<div class="note info small">✔ حُفظ تلقائيًا في «أنشطتي التفاعلية»، وتجدينه هناك للتجربة والتعديل.</div><div class="dzw"><iframe class="dzf" sandbox="allow-scripts"></iframe></div><div class="row" style="margin-top:10px;flex-wrap:wrap"><button class="btn acc" id="try">⛶ تجربة</button><button class="btn" id="dl">⬇️ تنزيل HTML</button><button class="btn" id="cp">📋 نسخ الكود</button><button class="btn" id="lk">🔗 رابط</button><button class="btn ai-btn" id="aed">✏️ تعديل بالمساعد</button></div>`;
   $('.dzf',E).srcdoc=it.html;$('#try',E).onclick=()=>htmlPlay(it);$('#dl',E).onclick=()=>exportQuizHtml(it);$('#cp',E).onclick=()=>copyActivityHtml(it);$('#lk',E).onclick=()=>shareActivity(it);$('#aed',E).onclick=()=>{m.close(true);aiEditHtml(it,onSaved)};
  }catch(e){$('#out',E).innerHTML=`<div class="note">${esc(e.message||'تعذّر الاتصال بالمساعد')}</div>`}
  b.disabled=false;b.textContent='🔁 تصميم آخر';return}
  try{result=await aiActivity({type,key,code:c,request:$('#ar',E).value.trim(),cls,useImages:$('#aimg',E).checked});
   const it={id:uid('item'),kind:'item',lib:libOfSub(type),sub:type,key:libOfSub(type)==='initiatives'?'all':key,code:c,classId:cls?.id||null,scope:cls?'class':'general',title:result.title||'',body:result.summary||'',target:result.target||'',duration:result.duration||'',objectives:result.objectives||[],materials:result.materials||[],steps:result.steps||[],assessment:result.assessment||'',rubric:result.rubric||[],tips:result.tips||'',bookPages:(result.bookPages||[]).map(Number).filter(Boolean),quiz:(result.quiz||[]).map(q=>({prompt:q.prompt||'',emoji:q.emoji||'',img:q._img||null,choices:(q.choices||[]).map(x=>typeof x==='string'?{emoji:'',text:x}:{emoji:x.emoji||'',text:x.text||'',img:x._img||null}),answer:+q.answer||0})),links:[],files:[],images:[],created:Date.now(),ai:true};
   if(it.lib==='initiatives'){it.executor=settings().teacher||'';it.stage=['جاري التنفيذ'];it.mechanism=(result.steps||[]).map((s,k)=>`${k+1}. ${s}`).join('\n');it.results=[result.assessment,result.tips].filter(Boolean).join('\n');it.benef=['الطلبة'];it.benefOther=result.target||'';it.sections=[{title:'فكرة المبادرة',text:result.summary||''},{title:'أهداف المبادرة',text:(result.objectives||[]).join('\n')}].filter(s=>s.text)}
   $('#out',E).innerHTML=activityHtml(it)+`<div id="bpv" class="thumbs" style="margin-top:8px"></div><div class="row" style="margin-top:10px">${it.quiz.length?'<button class="btn acc" id="try">▶️ تجربة</button>':''}<button class="btn pri" id="save">💾 حفظ في «${esc(LIB[it.lib].title)}»</button>${it.lib!=='interactive'&&it.lib!=='initiatives'?`<button class="btn" id="toInt">🎮 إضافة لأنشطتي التفاعلية</button>`:''}${it.lib==='practical'||it.lib==='question'||it.lib==='questions'?'<button class="btn" id="attP">📎 إرفاق ملف</button>':''}<button class="btn" id="edit">✏️ تعديل ثم حفظ</button></div><div id="attL" class="small" style="margin-top:6px"></div>`;
   $('#attP',E)&&($('#attP',E).onclick=async()=>{const fs=await pickFiles();if(!fs.length)return;toast('جارٍ الرفع…');const up=await uploadFiles(fs);up.forEach(f=>(String(f.type).startsWith('image/')?it.images:it.files).push(f));$('#attL',E).textContent='📎 '+[...it.images,...it.files].map(f=>f.name).join('، ')+' — اضغطي «حفظ» لحفظها مع النشاط'});
   if(it.bookPages.length&&it.key!=='all')bookThumbs($('#bpv',E),'book_'+key,it.bookPages.slice(0,3));
   $('#try',E)&&($('#try',E).onclick=()=>quizPlay(it));
   if(it.lib==='interactive'){Store.save(it);onSaved&&onSaved();$('#save',E).outerHTML=`<span class="badge" style="padding:6px 10px">✔ حُفظ في أنشطتي التفاعلية</span>${it.quiz.length?'<button class="btn" id="dl">⬇️ تنزيل HTML</button><button class="btn" id="cp">📋 نسخ الكود</button>':''}`;$('#dl',E)&&($('#dl',E).onclick=()=>exportQuizHtml(it));$('#cp',E)&&($('#cp',E).onclick=()=>copyActivityHtml(it))}
   else $('#save',E).onclick=()=>{Store.save(it);toast('تم الحفظ');m.close(true);onSaved&&onSaved()};
   $('#toInt',E)&&($('#toInt',E).onclick=()=>{const c2=clone(it);c2.id=uid('item');c2.lib='interactive';c2.sub='game';c2.created=Date.now();Store.save(c2);toast('أُضيف إلى أنشطتي التفاعلية 🎮');$('#toInt',E).disabled=true;$('#toInt',E).textContent='✔ أُضيف لأنشطتي التفاعلية'});
   $('#edit',E).onclick=()=>{m.close(true);itemEditor(it,onSaved)};
  }catch(e){$('#out',E).innerHTML=`<div class="note">${esc(e.message||'تعذّر الاتصال بالمساعد')}</div>`}
  b.disabled=false;b.textContent='🔁 اقتراح آخر'};
}
function mdLite(s){return esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/^#{1,4}\s*(.+)$/gm,'<b>$1</b>').replace(/^\s*[-•*]\s+/gm,'• ')}
function aiPanel(el,{key,code}){
 const st=UI.chat||(UI.chat={});const ck=key+'|'+(code||'');const msgs=st[ck]||(st[ck]=[]);
 if(!SAMPLE){el.innerHTML='<div class="note">المساعد الذكي غير متاح في هذا العرض. افتحي الدفتر من حسابك في Claude لتفعيله.</div>';return}
 el.innerHTML=`<div class="note info small" style="margin-bottom:10px">اختاري نوع النشاط ليصمّمه المساعد بالاعتماد على أهداف الدرس وصفحات الكتاب والدليل، ثم عدّليه واحفظيه — أو اكتبي أي سؤال بحرية.</div>
 <div class="row" style="margin-bottom:10px">${AI_TYPES.map(t=>`<button class="btn sm" data-q="${t[0]}">${t[1]}</button>`).join('')}</div>
 <div class="chat" id="chat">${msgs.map(x=>`<div class="msg ${x.role==='user'?'u':'a'}">${x.role==='user'?esc(x.content):mdLite(x.content)}</div>`).join('')}</div>
 <div class="row" style="margin-top:10px"><textarea class="in" id="cq" style="min-height:56px;flex:1" placeholder="اسألي المساعد… مثال: اقترح 3 استراتيجيات لتدريس هذا الدرس لطلاب الصف ${GRADE_NAMES[kG(key)]}"></textarea><button class="btn ai-btn" id="cs">إرسال</button></div>
 ${msgs.length?'<div class="row" style="margin-top:6px"><button class="btn sm" id="csave">💾 حفظ آخر رد كنشاط</button><button class="btn sm ghost" id="cclr">مسح المحادثة</button></div>':''}`;
 $$('[data-q]',el).forEach(b=>b.onclick=()=>aiDialog({sub:b.dataset.q,key,code:code||'',onSaved:()=>toast('محفوظ في المكتبة')}));
 const send=async()=>{const q=$('#cq',el).value.trim();if(!q)return;msgs.push({role:'user',content:q});aiPanel(el,{key,code});
  const ch=$('#chat',el);const a=document.createElement('div');a.className='msg a';a.innerHTML='<span class="spin"></span>';ch.appendChild(a);ch.scrollTop=1e9;
  const conv=msgs.map((x,i)=>i===0?{role:'user',content:`${AI_BASE}\n\n${lessonContext(key,code)}\n\nسؤال المعلم: ${x.content}`}:x);
  try{const imgs=msgs.length===1?await lessonImages(key,code,{guide:true}):[];const t=await aiCall(conv,{images:imgs,onText:({text})=>{a.innerHTML=mdLite(text);ch.scrollTop=1e9}});msgs.push({role:'assistant',content:t})}
  catch(e){msgs.pop();toast(e.message||'تعذّر الاتصال')}aiPanel(el,{key,code})};
 $('#cs',el).onclick=send;$('#cq',el).onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}};
 $('#cclr',el)&&($('#cclr',el).onclick=()=>{st[ck]=[];aiPanel(el,{key,code})});
 $('#csave',el)&&($('#csave',el).onclick=()=>{const last=[...msgs].reverse().find(x=>x.role==='assistant');if(!last)return;
  const m=modal({title:'حفظ الرد',body:`<label class="f">احفظيه في</label><select class="in" id="sl">${AI_TYPES.map(t=>`<option value="${t[0]}">${t[1]}</option>`).join('')}</select>`,foot:'<button class="btn pri" id="ok">متابعة</button>'});
  $('#ok',m.el).onclick=()=>{const sub=$('#sl',m.el).value,lib=libOfSub(sub);m.close(true);itemEditor({id:uid('item'),kind:'item',lib,sub,key:lib==='initiatives'?'all':key,code:code||'',scope:'general',title:'',body:last.content,steps:[],materials:[],objectives:[],links:[],files:[],images:[],quiz:[],created:Date.now(),ai:true},()=>toast('تم الحفظ'))}});
}
VIEWS.ai=function(){
 const key=curKey();const code=UI.aiCode?.[key]||'';
 $('#main').innerHTML=topbar('✨ المساعد الذكي')+`<div class="card"><div class="row" style="align-items:flex-end;margin-bottom:12px">${lessonSelect(key,code,{id:'ail',label:'سياق الدرس'})}</div><div id="aip"></div></div>`;
 bindCtx(VIEWS.ai);
 $('#ail').onchange=e=>{UI.aiCode=UI.aiCode||{};UI.aiCode[key]=e.target.value;VIEWS.ai()};
 aiPanel($('#aip'),{key,code});
};

/* ===== التشغيل ===== */
async function boot(){
 document.body.innerHTML='<div style="display:grid;place-items:center;height:100vh;font-family:Readex Pro"><div><span class="spin"></span> جارٍ فتح الدفتر…</div></div>';
 for(let i=0;i<0&&!(window.claude&&window.claude.use);i++)await new Promise(r=>setTimeout(r,100));
 if(window.claude&&claude.use){await Store.init();
  try{[ASSETS,DOWNLOADS,SAMPLE]=await Promise.all([claude.use('assets'),claude.use('downloads'),claude.use('sample')]);claude.use('mcp').then(m=>{MCP=m;if(m&&UI.view==='books')VIEWS.books();if(m)autoDriveBackup()}).catch(()=>{});if(SAMPLE&&SAMPLE.limits){const l=await SAMPLE.limits();SAMPLE_IMG=!!(l&&l.images)}}catch(e){console.warn(e)}}
 else await Store.init();
 if(!lsGet('itnb_th2',0)){try{const s=settings();s.theme='blush';saveSettings(s)}catch(e){}lsSet('itnb_th2',1);lsSet('itnb_theme','blush')}
 if(!myGrades().includes(UI.grade)){UI.grade=myGrades()[0];saveUI()}
 applyTheme(settings().theme||lsGet('itnb_theme','blush'));
 shell();window.addEventListener('hashchange',route);route();
}
boot();

</script></body></html>
