<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#E9CFC9"><link rel="apple-touch-icon" href="icon-180.png"><link rel="icon" href="icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="دفتر المعلم">
<title>دفتر معلم تقنية المعلومات</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;500;600;700&family=El+Messiri:wght@500;600;700&family=Aref+Ruqaa:wght@400;700&display=swap" rel="stylesheet">
<style>:root{--desk:#F8F8F6;--sheet:#F3F3F1;--card:#FFFFFF;--ink:#17191C;--mute:#8B9096;--line:#ECECE9;
 --blue:#BFE3EE;--deepblue:#7FC4DA;--green:#D4EAC0;--done:#8CC46A;--yellow:#F3EE8F;--pink:#F7D3CF;--peach:#F6C29B;--lilac:#DED8F2;--rose:#F0A06E;--pill:#2B2627;
 --pri:#17191C;--acc:#7A5FD0;--bad:#C2410C;--ok:#4E8B2E;--r:22px;--sh:0 1px 2px rgba(16,24,40,.04),0 2px 10px rgba(16,24,40,.05)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--desk);color:var(--ink);font-family:"Readex Pro","IBM Plex Sans Arabic",system-ui,sans-serif;font-size:14.5px;line-height:1.7}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px;border-radius:8px}
/* ===== شريط التطبيق والقائمة ===== */
.book{max-width:1120px;margin:0 auto;padding:0 12px 60px}
.appbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:10px;padding:10px 0;background:var(--desk)}
.menubtn{width:42px;height:42px;border-radius:14px;border:0;background:var(--card);display:grid;place-items:center;box-shadow:0 1px 4px rgba(0,0,0,.08);font-size:18px;cursor:pointer}
.menubtn[aria-expanded="true"]{background:var(--ink);color:var(--card)}
.apptitle{font-weight:600;font-size:15px}
.appsec{font-size:13px;color:var(--mute)}.appsec::before{content:"·";margin-inline-end:8px}
.appbar .sp{flex:1}
.mode{font-size:11.5px;color:var(--mute);background:var(--card);border-radius:999px;padding:3px 12px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.menuwrap{position:fixed;inset:0;z-index:70;background:rgba(23,25,28,.18)}
.menuwrap[hidden]{display:none}
.menupanel{position:absolute;top:62px;right:max(12px,calc((100vw - 1120px)/2 + 12px));width:min(310px,calc(100vw - 24px));max-height:calc(100vh - 80px);overflow:auto;background:var(--card);border-radius:20px;padding:10px;box-shadow:0 12px 40px rgba(0,0,0,.16)}
.mhead{padding:4px 8px 8px;font-size:12.5px;color:var(--mute)}
.msep{height:1px;background:var(--line);margin:8px 4px}
.mitem{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:12px;font-size:14px;text-decoration:none;color:var(--ink)}
.mitem::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--c);flex:0 0 9px}
.mitem:hover{background:var(--sheet)}
.mitem.on{background:var(--ink);color:var(--card)}.mitem.on::before{background:var(--yellow)}
/* ===== العناوين والسياق ===== */
.topbar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin:4px 0 14px}
.topbar h1{margin:0;font-size:26px;font-weight:700}
.ctx{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chips{display:flex;gap:4px;background:var(--card);border-radius:999px;padding:4px;box-shadow:0 1px 3px rgba(0,0,0,.05);flex-wrap:wrap}
.chips button{border:0;background:none;padding:5px 14px;border-radius:999px;cursor:pointer;font-weight:500;font-size:13.5px;color:var(--ink)}
.chips button.on{background:var(--ink);color:var(--card)}
.menu-btn{display:none}
/* ===== البطاقات ===== */
.card{background:var(--card);border:0;border-radius:var(--r);box-shadow:var(--sh);padding:16px;margin-bottom:14px}
.card h2,.card h3{font-weight:600}
.card h2{margin:0 0 10px;font-size:15px;display:inline-block;background:var(--tc,var(--pink));color:var(--pill);border-radius:999px;padding:2px 16px 3px;font-weight:600}
.card:nth-of-type(6n+2) h2{--tc:var(--blue)}.card:nth-of-type(6n+3) h2{--tc:var(--green)}.card:nth-of-type(6n+4) h2{--tc:var(--yellow)}.card:nth-of-type(6n+5) h2{--tc:var(--lilac)}.card:nth-of-type(6n) h2{--tc:var(--peach)}
.item .ttl{display:inline-block}
/* رأس اليوم مثل مفكرتي */
.dhd{display:flex;align-items:center;gap:12px;margin:4px 0 12px;flex-wrap:wrap}
.av{width:46px;height:46px;border-radius:50%;background:var(--pink);display:grid;place-items:center;font-weight:700;font-size:19px;color:var(--pill)}
.dhd h1{font-size:19px;margin:0;font-weight:600}.dhd .sub{color:var(--mute);font-size:12.5px}.dhd .sp{flex:1}
.rbtn{width:42px;height:42px;border-radius:50%;border:0;background:var(--card);box-shadow:0 1px 4px rgba(0,0,0,.08);font-size:17px;display:grid;place-items:center;text-decoration:none;color:var(--ink)}
.week{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:14px}
.week a{border-radius:999px;background:var(--card);padding:8px 0 6px;display:flex;flex-direction:column;align-items:center;gap:4px;box-shadow:0 1px 3px rgba(0,0,0,.05);text-decoration:none;color:var(--ink)}
.week .wl{font-size:12px;color:var(--mute)}.week .wn{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:600;font-size:13px}
.week a.now .wn{background:var(--blue)}.week a.now .wl{color:var(--ink);font-weight:700}
.week .wd{width:6px;height:6px;border-radius:50%;background:transparent}.week .wd.on{background:var(--ink)}
.card h3{margin:0 0 6px;font-size:14.5px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row.between{justify-content:space-between}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(auto-fill,minmax(290px,1fr))}
.g3{grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.g4{grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}
/* ===== الأزرار والحقول ===== */
.btn{border:0;background:var(--sheet);border-radius:999px;padding:6px 14px;cursor:pointer;display:inline-flex;gap:6px;align-items:center;font-weight:500;font-size:13.5px;white-space:nowrap;text-decoration:none;color:var(--ink)}
.btn:hover{background:#EAEAE7}
.btn.pri{background:var(--ink);color:var(--card)}.btn.pri:hover{background:#2c2f33}
.btn.acc{background:var(--lilac);color:var(--pill)}
.btn.ghost{background:transparent}
.btn.bad{color:var(--bad)}
.btn.sm{padding:3px 10px;font-size:12.5px}
.btn:disabled{opacity:.5;cursor:default}
.ai-btn{background:linear-gradient(135deg,var(--lilac),var(--blue));color:var(--pill)}
label.f{display:block;font-size:12.5px;color:var(--mute);font-weight:500;margin-bottom:4px}
.in,select.in,textarea.in{width:100%;border:0;border-radius:12px;padding:8px 12px;background:var(--sheet)}
textarea.in{min-height:80px;resize:vertical;line-height:1.8}
.in:focus{outline:2px solid var(--ink);background:#fff}
.fields{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.muted{color:var(--mute)}.small{font-size:12.5px}
.badge{display:inline-block;font-size:11.5px;font-weight:600;padding:1px 10px;border-radius:999px;background:var(--blue);color:var(--pill)}
.badge.acc{background:var(--lilac)}.badge.warn{background:var(--peach)}.badge.bad{background:var(--pink)}.badge.ok{background:var(--green)}
.note{background:#FFF8EC;border-radius:14px;padding:9px 14px;font-size:13.5px;color:#7a4a16}
.note.info{background:#EEF7FA;color:#24505e}
/* ===== الجداول ===== */
table.t{width:100%;border-collapse:separate;border-spacing:0;font-size:13.5px}
table.t th,table.t td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:right;vertical-align:top}
table.t th{background:var(--sheet);font-weight:600;position:sticky;top:0;z-index:1}
table.t tr:hover td{background:#FBFBFA}
table.t td input,table.t td textarea{width:100%;border:0;background:transparent;padding:2px 4px;resize:vertical;border-radius:8px}
table.t td input:focus,table.t td textarea:focus{outline:2px solid var(--ink);background:#fff}
table.t td.num input{text-align:center;min-width:52px}
.tw{overflow:auto;max-height:70vh;border-radius:16px;border:1px solid var(--line)}
/* ===== الدروس ===== */
.lessons{display:grid;grid-template-columns:300px 1fr;gap:14px;align-items:start}
.ulist{position:sticky;top:70px;max-height:calc(100vh - 86px);overflow:auto}
.ulist .u{font-weight:600;margin:12px 4px 4px;font-size:13.5px;display:flex;align-items:center;gap:8px}
.ulist .u::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--deepblue)}
.ulist button{display:flex;width:100%;text-align:right;gap:8px;align-items:center;border:0;background:none;padding:6px 8px;border-radius:12px;cursor:pointer;font-size:13.5px}
.ulist button:hover{background:var(--sheet)}
.ulist button.on{background:var(--ink);color:var(--card)}
.ulist .code{font-size:11px;background:var(--sheet);border-radius:999px;padding:0 8px;color:var(--ink);font-weight:600}
.ulist button.on .code{background:var(--yellow);color:var(--pill)}
.tabs{display:flex;gap:4px;margin:12px 0 14px;flex-wrap:wrap}
.tabs button{border:0;background:var(--sheet);padding:5px 13px;cursor:pointer;font-weight:500;font-size:13px;border-radius:999px}
.tabs button.on{background:var(--ink);color:var(--card)}
.item{border-radius:18px;padding:12px;background:var(--card);display:flex;flex-direction:column;gap:6px;box-shadow:var(--sh)}
.card .item{background:var(--sheet);box-shadow:none}
.item .ttl{font-weight:600}
.item .acts{display:flex;gap:4px;flex-wrap:wrap;margin-top:auto}
.card .item .btn{background:var(--card)}.card .item .btn.pri{background:var(--ink)}
.empty{text-align:center;padding:26px;color:var(--mute);border:1.5px dashed #D3D6DA;border-radius:18px;background:var(--sheet)}
.empty .ic{font-size:34px}
.stat{display:flex;flex-direction:column;gap:0}.stat b{font-size:30px;font-weight:600;line-height:1.3}
ol.steps,ul.lst{margin:4px 0;padding-inline-start:22px}
/* ===== الغلاف ===== */
.cover{position:relative;background:var(--blue);border-radius:28px;padding:28px 24px 70px;margin-bottom:14px;text-align:center;overflow:hidden}
.cover .bc{position:absolute;top:20px;right:20px;width:84px;height:84px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-size:30px}
.cover .owner{font-size:clamp(34px,6vw,64px);font-weight:700;line-height:1.25;margin:22px 0 2px;color:var(--pill)}
.cover .sub{color:rgba(0,0,0,.6);font-size:14px}
.cover .rule{width:min(70%,420px);height:1.5px;background:var(--pill);margin:10px auto}
.cover .year{position:absolute;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--card);border-radius:999px;padding:4px 22px;font-size:15px;white-space:nowrap}
.cover .edit{position:absolute;top:20px;left:20px}
.idxs{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.idx{background:var(--card);border-radius:18px;padding:14px;display:flex;align-items:center;gap:8px;justify-content:center;text-decoration:none;color:var(--ink);font-weight:500;box-shadow:var(--sh)}
.idx::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--c)}
.idx:hover{background:var(--ink);color:var(--card)}
.statc{border-radius:22px;padding:14px 16px;color:var(--pill)}
/* ===== النوافذ ===== */
.modal-bg{position:fixed;inset:0;background:rgba(23,25,28,.3);display:flex;align-items:flex-start;justify-content:center;z-index:80;padding:28px 12px;overflow:auto}
.modal{background:var(--card);border-radius:24px;width:min(900px,100%);box-shadow:0 10px 40px rgba(0,0,0,.25);display:flex;flex-direction:column;max-height:calc(100vh - 56px)}
.modal.wide{width:min(1200px,100%)}
.modal .mh{display:flex;justify-content:space-between;align-items:center;padding:14px 18px 10px}
.modal .mh h3{margin:0;font-size:17px;font-weight:600}
.modal .mb{padding:4px 18px 16px;overflow:auto}
.modal .mf{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--card);padding:7px 18px;border-radius:999px;z-index:95;font-size:13.5px}
.files{display:flex;flex-wrap:wrap;gap:6px}
.file{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:2px 10px;font-size:12.5px;background:var(--card);border:1px solid var(--line);max-width:100%}
.file a{text-decoration:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:220px}
.file button{border:0;background:var(--rose);color:#fff;border-radius:50%;width:16px;height:16px;font-size:10px;padding:0;cursor:pointer}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}
.thumbs img{height:110px;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.1);cursor:zoom-in;background:#fff}
.thumbs .th{position:relative}.thumbs .th button{position:absolute;top:-6px;right:-6px;border:2px solid #fff;border-radius:50%;width:22px;height:22px;background:var(--ink);color:#fff;font-size:11px;cursor:pointer;padding:0}
.book-i{border-radius:18px;padding:12px;background:var(--sheet);display:flex;gap:12px;align-items:center}
.book-i .cv{width:52px;height:68px;border-radius:10px;display:grid;place-items:center;font-size:24px;color:var(--pill);font-weight:700;flex:none}
.viewer{display:flex;flex-direction:column;align-items:center;gap:10px}
.viewer canvas{max-width:100%;border-radius:10px;box-shadow:0 4px 16px rgba(0,0,0,.12);background:#fff}
.chat{display:flex;flex-direction:column;gap:10px;max-height:60vh;overflow:auto;padding:4px}
.msg{padding:10px 14px;border-radius:18px;max-width:92%;white-space:pre-wrap}
.msg.u{background:var(--blue);align-self:flex-start;border-bottom-right-radius:6px}
.msg.a{background:var(--sheet);align-self:flex-end;border-bottom-left-radius:6px}
.spin{display:inline-block;width:15px;height:15px;border:2px solid #d6d8db;border-top-color:var(--ink);border-radius:50%;animation:sp 1s linear infinite;vertical-align:middle}
@keyframes sp{to{transform:rotate(360deg)}}
.act-card{border-radius:18px;padding:14px;background:var(--sheet)}
.act-card h4{margin:0 0 4px;font-size:16px;font-weight:600}
/* ===== مشغّل الأسئلة ===== */
.qz{position:fixed;inset:0;background:linear-gradient(160deg,#EAF6FA,#F4FAEE);z-index:90;display:flex;flex-direction:column;align-items:center;padding:20px;overflow:auto}
.qz .top{width:100%;max-width:1100px;display:flex;justify-content:space-between;align-items:center}
.qz .prompt{font-size:clamp(22px,3.2vw,40px);font-weight:700;text-align:center;margin:16px 0 6px}
.qz .pemoji{font-size:clamp(60px,9vw,120px);text-align:center;line-height:1.1}
.qz .qimg{max-height:34vh;max-width:90%;border-radius:18px;box-shadow:var(--sh);margin:6px auto;display:block;background:#fff}
.qz .choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:18px;width:100%;max-width:1100px;margin-top:16px}
.qz .ch{background:#fff;border:4px solid transparent;border-radius:28px;padding:18px 10px;cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.07);display:flex;flex-direction:column;align-items:center;gap:6px;transition:transform .15s}
.qz .ch:hover{transform:translateY(-4px)}
.qz .ch .e{font-size:clamp(56px,7vw,96px);line-height:1.1}
.qz .ch img{max-height:120px;max-width:100%}
.qz .ch .tx{font-size:20px;font-weight:600}
.qz .ch.right{border-color:var(--done);background:#F1F9EA}
.qz .ch.wrong{border-color:var(--rose);animation:sh .4s}
@keyframes sh{25%{transform:translateX(8px)}75%{transform:translateX(-8px)}}
.qz .fb{font-size:30px;font-weight:700;margin-top:14px;min-height:46px}
.dots{display:flex;gap:6px}.dots i{width:12px;height:12px;border-radius:50%;background:#fff;box-shadow:inset 0 0 0 1px #d6d8db}.dots i.d{background:var(--done)}.dots i.c{background:var(--rose)}
.qed{border-radius:16px;padding:10px;margin-bottom:10px;background:var(--sheet)}
.qed .in{background:#fff}
.qed .chs{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px;margin-top:8px}
.qed .chs .c{display:flex;gap:4px;align-items:center}
.qed .chs .c input.em{width:58px;text-align:center;font-size:22px}
.setup{max-width:720px;margin:30px auto}
@media (max-width:900px){.lessons{grid-template-columns:1fr}.ulist{position:static;max-height:none}.book{padding:0 8px 50px}.mode{display:none}}
/* ================= تصميم المفكرة (planner) ================= */
:root{--paper:#FCFAF6;--paper-line:#E9E1D6;--terra:#B98B6E;--rose:#D8B9A3;--salmon:#CDA68C;--sage:#A88B76;--slate:#8A6A55;--mustard:#C9A45C;--char:#6E5444;--caramel:#B98B6E;--gold:#F0DDB0;--pinktab:#D8B9A3}
html,body{background:#E9E7E3}
body{background:repeating-linear-gradient(90deg,rgba(255,255,255,.35) 0 1px,transparent 1px 12px),linear-gradient(180deg,#F1EFEB,#E4E1DC);background-attachment:fixed}
.ttlfont,.phead h1,.card h2,.stab,.ttab,.cbook .bt,.idx-pill,.pframe h2,.quote{font-family:"El Messiri","Readex Pro",sans-serif}
.appbar{display:none}
.planner{display:flex;align-items:flex-start;max-width:1240px;margin:18px auto 40px;padding:0 10px}
.paper{position:relative;flex:1;min-width:0;background:var(--paper);border-radius:6px 16px 16px 6px;box-shadow:0 18px 40px -18px rgba(60,40,20,.35),0 2px 6px rgba(0,0,0,.06);padding:0 66px 40px 26px;min-height:calc(100vh - 60px);
 background-image:radial-gradient(circle at 12% 8%,rgba(232,167,155,.10),transparent 40%),radial-gradient(circle at 88% 92%,rgba(155,174,138,.12),transparent 40%)}
.rings{position:absolute;top:24px;bottom:24px;right:-14px;width:48px;pointer-events:none;
 background:radial-gradient(ellipse 10px 6px at 30px 50%,#6b6b6b 0 70%,transparent 72%) 0 0/48px 38px repeat-y,
 linear-gradient(90deg,transparent 0 18px,#cfcfcf 18px 22px,#9a9a9a 22px 26px,#e9e9e9 26px 30px,transparent 30px) 0 0/48px 38px repeat-y;opacity:.9}
.rings::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(180deg,transparent 0 12px,rgba(0,0,0,.0) 12px 38px)}
.paper::before{content:"";position:absolute;top:0;bottom:0;right:44px;width:1px;background:var(--paper-line)}
/* الألسنة الجانبية */
.sidetabs{display:flex;flex-direction:column;gap:3px;padding-top:56px;flex:0 0 46px;position:sticky;top:10px;max-height:calc(100vh - 20px);overflow-y:auto;scrollbar-width:none}
.sidetabs::-webkit-scrollbar{display:none}
.stab{display:block;writing-mode:vertical-rl;text-decoration:none;color:#fff;background:var(--c);border-radius:0 10px 10px 0;padding:9px 5px;font-size:12.5px;font-weight:600;width:36px;opacity:.82;margin-inline-start:0;transition:width .15s,opacity .15s;box-shadow:inset -3px 0 0 rgba(0,0,0,.06);white-space:nowrap;text-align:center}
.stab:hover{opacity:1}
.stab.on{opacity:1;width:46px;box-shadow:none}
/* الألسنة العلوية */
.phtop{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;flex-wrap:wrap;margin:0 0 6px}
.ttabs{display:flex;gap:3px;flex-wrap:wrap;margin-top:-1px}
.ttab{border:0;cursor:pointer;color:#fff;background:var(--c,var(--pinktab));border-radius:0 0 10px 10px;padding:9px 14px 6px;font-size:13.5px;font-weight:600;opacity:.7;min-height:34px}
.ttab.on{opacity:1;padding-top:14px}
.phead{display:flex;align-items:center;gap:12px;margin:14px 0 14px}
.phead h1{margin:0;font-size:28px;font-weight:700;color:var(--char);display:inline-block;border:2px solid var(--salmon);outline:1px solid var(--salmon);outline-offset:4px;padding:2px 22px;border-radius:2px;background:#fff}
.phead .fl{width:46px;height:46px}
/* الصناديق */
.card{background:#fff;border:1px solid #E6DED3;border-radius:10px;box-shadow:0 1px 0 rgba(0,0,0,.02);padding:14px}
.card h2{display:block;margin:-14px -14px 12px;border-radius:9px 9px 0 0;padding:6px 14px;font-size:15px;color:#fff;background:var(--tc,var(--terra))}
.card:nth-of-type(6n+1) h2{--tc:var(--terra)}.card:nth-of-type(6n+2) h2{--tc:var(--char)}.card:nth-of-type(6n+3) h2{--tc:var(--sage)}.card:nth-of-type(6n+4) h2{--tc:var(--slate)}.card:nth-of-type(6n+5) h2{--tc:var(--rose)}.card:nth-of-type(6n) h2{--tc:var(--mustard)}
.card .row.between>h2,.card .row>h2{margin:0;border-radius:999px;padding:3px 16px}
.item{border:1px solid #EEE6DB;box-shadow:none;border-radius:10px;background:#FFFDF9}
.card .item{background:#FBF7F1}
.btn{border-radius:999px;background:#F3EEE7;color:var(--char)}.btn:hover{background:#ECE4D9}
.btn.pri{background:var(--terra);color:#fff}.btn.pri:hover{background:#b9684f}
.chips{background:#F3EEE7;box-shadow:none}.chips button.on{background:var(--terra);color:#fff}
.tabs button.on{background:var(--terra)}.ulist button.on{background:var(--char)}
.in,select.in,textarea.in{background:#FBF7F1;border:1px solid #EEE6DB}
textarea.in{background-image:repeating-linear-gradient(transparent 0 25px,#EFE7DC 25px 26px);line-height:26px}
.statc{border:1px solid rgba(0,0,0,.04)}
.badge{background:#F5ECE4;color:#8a4a3c}.badge.acc{background:#EFE6DB;color:#4f6340}
table.t th{background:#F6EFE6}
.empty{background:#FBF7F1;border-color:#E6DBCC}
.idx{background:#fff;border:1px solid #EEE6DB;box-shadow:none}
/* صفحة الفهرس */
.quote{background:var(--salmon);color:#fff;text-align:center;border-radius:4px;padding:16px 20px;font-size:18px;line-height:1.8;max-width:560px;margin:6px auto 18px;box-shadow:0 4px 0 rgba(0,0,0,.05)}
.idx-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px 14px;max-width:760px;margin:0 auto 18px}
.idx-pill{display:block;text-align:center;background:var(--c,var(--salmon));color:#fff;text-decoration:none;border-radius:6px;padding:9px 10px;font-weight:600;font-size:15.5px;box-shadow:0 3px 0 rgba(0,0,0,.08)}
.idx-pill:hover{filter:brightness(1.05);transform:translateY(-1px)}
.idx-sub{display:flex;gap:6px;justify-content:center;margin-top:6px;flex-wrap:wrap}
.idx-sub a{font-size:12.5px;background:#F5ECE4;color:#8a4a3c;border-radius:6px;padding:2px 10px;text-decoration:none}
.idx-head{font-family:"El Messiri",sans-serif;text-align:center;color:var(--terra);font-weight:700;margin:10px 0 8px}
.pframe{text-align:center;margin:10px auto 16px;position:relative;width:max-content;max-width:100%;border:2px solid #fff;outline:1.5px solid var(--salmon);outline-offset:-8px;padding:22px 46px;background:rgba(255,255,255,.6)}
.pframe h2{margin:0;font-size:clamp(26px,4vw,40px);color:var(--char)}.pframe .sub{color:#8b7f74;font-size:13.5px}
.pframe svg{position:absolute;left:-26px;bottom:-22px;width:70px}
/* الغلاف */
.coverscene{min-height:100vh;display:grid;place-items:center;position:relative;overflow:hidden;padding:30px 10px}
.cbook{position:relative;width:min(360px,78vw);aspect-ratio:3/4.1;border-radius:8px 16px 16px 8px;background:linear-gradient(160deg,#F4F1EC,#E2DCD4 70%);box-shadow:0 40px 50px -26px rgba(40,25,10,.55),inset -10px 0 14px -10px rgba(0,0,0,.18),inset 6px 0 0 rgba(255,255,255,.5);cursor:pointer;transition:transform .25s}
.cbook:hover{transform:translateY(-4px) rotate(-.5deg)}
.cbook .band{position:absolute;left:0;right:0;bottom:0;height:30%;background:linear-gradient(180deg,#BE9070,#A97B5D);border-radius:0 0 16px 8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.cbook .band::before{content:"";position:absolute;inset:7px;border:1.5px dashed rgba(255,240,220,.55);border-radius:6px 12px 12px 6px}
.cbook .bt{color:var(--gold);font-size:clamp(17px,4.6vw,23px);font-weight:700;text-shadow:0 1px 0 rgba(0,0,0,.15);text-align:center;line-height:1.4;padding:0 18px}
.cbook .by{color:var(--gold);font-size:13px;opacity:.95}
.cbook .strap{position:absolute;left:-14px;top:42%;width:92px;height:52px;background:linear-gradient(180deg,#C29475,#A97B5D);border-radius:10px 26px 26px 10px;box-shadow:0 4px 8px rgba(0,0,0,.2)}
.cbook .strap::before{content:"";position:absolute;inset:5px;border:1.5px dashed rgba(255,240,220,.5);border-radius:8px 22px 22px 8px}
.cbook .strap::after{content:"";position:absolute;right:18px;top:50%;width:18px;height:18px;margin-top:-9px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#FFF4C9,#D3A94D 60%,#9D7426);box-shadow:0 1px 2px rgba(0,0,0,.3)}
.cbook .tname{position:absolute;top:18%;left:0;right:0;text-align:center;color:#A99C8E;font-family:"El Messiri",sans-serif;font-size:15px;letter-spacing:.02em}
.cbook .tlogo{position:absolute;top:30%;left:0;right:0;text-align:center;font-size:44px;opacity:.55;filter:grayscale(.4)}
.chint{position:absolute;bottom:22px;left:50%;transform:translateX(-50%);background:#fff;border-radius:999px;padding:6px 18px;font-size:13.5px;color:var(--char);box-shadow:0 2px 8px rgba(0,0,0,.08)}
.deco{position:absolute;pointer-events:none}
.deco.leaf{top:-30px;left:-20px;width:min(230px,40vw)}.deco.clips{top:30px;right:40px;width:110px}.deco.pad{bottom:40px;right:5%;width:min(170px,28vw)}.deco.cup{bottom:60px;left:6%;width:min(120px,22vw)}
@media (max-width:900px){

/* ================= ثيم موحّد: كراميل وكريمي ================= */
:root{--terra:#B98B6E;--sage:#A88B76;--slate:#8A6A55;--mustard:#C9A45C;--char:#5A4538;--rose:#D8B9A3;--salmon:#CDA68C;--pinktab:#D8B9A3;--caramel:#B98B6E;--gold:#F0DDB0;--paper:#FCF9F5;--paper-line:#EADFD3}
html,body{background:#EEE7DF}
body{background:repeating-linear-gradient(90deg,rgba(255,255,255,.28) 0 1px,transparent 1px 12px),linear-gradient(180deg,#F3EEE8,#E7DFD6);background-attachment:fixed;color:#4A3B32}
.paper{background-image:radial-gradient(circle at 10% 6%,rgba(205,166,140,.12),transparent 40%),radial-gradient(circle at 90% 94%,rgba(201,164,92,.10),transparent 40%)}
.phead h1{color:#5A4538;border-color:#CDA68C;outline-color:#CDA68C}
.card{border-color:#EADFD3}
.card h2,.card:nth-of-type(n) h2{--tc:#B98B6E;background:linear-gradient(90deg,#B98B6E,#C9A285)}
.card:nth-of-type(2n) h2{background:linear-gradient(90deg,#9C7258,#B48A70)}
.btn{background:#F3ECE4;color:#5A4538}.btn:hover{background:#EBE1D6}
.btn.pri{background:#B98B6E;color:#fff}.btn.pri:hover{background:#A67A5E}
.btn.acc{background:#EFE3D6;color:#6E5444}
.ai-btn{background:linear-gradient(135deg,#C9A45C,#B98B6E);color:#fff}
.chips{background:#F3ECE4}.chips button{color:#5A4538}.chips button.on{background:#B98B6E;color:#fff}
.tabs button{background:#F3ECE4}.tabs button.on{background:#B98B6E;color:#fff}
.ulist button.on{background:#6E5444;color:#fff}.ulist .u::before{background:#C9A45C}.ulist button.on .code{background:#F0DDB0;color:#5A4538}
.in,select.in,textarea.in{background:#FCF8F3;border-color:#EADFD3}
textarea.in{background-image:repeating-linear-gradient(transparent 0 25px,#EFE5DA 25px 26px)}
.badge{background:#F3E6DA;color:#7A5A45}.badge.acc{background:#EFE6D2;color:#7A6230}.badge.ok{background:#EAF0E2;color:#5b6b44}.badge.warn{background:#F6E6D2;color:#8a5a2a}

ب تسمية الأجزاء المعروفة.\n• لعبة: أشير إلى جزء من الجهاز والطالب يسميه.\n• مناقشة أهمية التعامل بحذر مع الأسلاك.", "obj": "1. يتعرف الطالب إلى الأجزاء الأساسية لجهاز الحاسوب.\n2. يسمي الشاشة ولوحة المفاتيح والفأرة ومكبرات الصوت والطابعة ووحدة النظام.\n3. يوصل أجزاء الحاسوب بوحدة النظام بصورة صحيحة تحت إشراف المعلمة.\n4. يشغل جهاز الحاسوب ويوقفه بالطريقة الصحيحة.\n5. يلتزم بإرشادات الأمن والسلامة عند استخدام الجهاز.", "procedures": "1. شرح المفهوم من خلال صور الكتاب ومناقشة أمثلة قريبة من حياة الطالب.\n2. تنفيذ النشاط العملي أو المطابقة/التصنيف الوارد في الدرس تدريجيًا.\n3. تقديم نموذج أمام الطلاب ثم إتاحة تطبيق فردي أو ثنائي مع المتابعة.", "formative": "• ضع دائرة حول أجزاء جهاز الحاسوب.\n• صل الأجزاء بوحدة النظام.\n• رتب خطوات تشغيل الجهاز وإيقافه.\n• ما السلوك الآمن عند التعامل مع الأسلاك؟", "closing": "• مهمة عملية: تسمية أجزاء جهاز حاسوب حقيقي أو صورة، ثم تحديد وظيفة كل جزء.\n• سؤال ختامي حول أهم إرشادات السلامة.", "homework": "• مراجعة أجزاء جهاز الحاسوب وإرشادات الأمن والسلامة."}}, "1.3": {"t": "سطح المكتب", "f": {"terms": "• سطح المكتب Desktop\n• هذا الحاسوب الشخصي This PC\n• المستندات Documents\n• متصفح الإنترنت Internet Browser\n• سلة المحذوفات Recycle Bin\n• بدء Start\n• الساعة Clock\n• الملفات الرقمية: نص، صورة، صوت، فيديو", "intro": "• عرض سطح مكتب على الشاشة وسؤال: ماذا ترى؟\n• تحديد الرموز على سطح المكتب من خلال صورة الكتاب.\n• ربط كل أيقونة بوظيفتها.", "obj": "1. يتعرف الطالب إلى سطح المكتب ورموزه الأساسية.\n2. يميز أيقونات هذا الحاسوب الشخصي والمستندات ومتصفح الإنترنت وسلة المحذوفات.\n3. يتعرف إلى زر بدء والساعة.\n4. يميز بعض أنواع الملفات الرقمية مثل النص والصورة والصوت والفيديو.", "procedures": "1. شرح المفهوم من خلال صور الكتاب ومناقشة أمثلة قريبة من حياة الطالب.\n2. تنفيذ النشاط العملي أو المطابقة/التصنيف الوارد في الدرس تدريجيًا.\n3. تقديم نموذج أمام الطلاب ثم إتاحة تطبيق فردي أو ثنائي مع المتابعة.", "formative": "• صل كل أيقونة بوظيفتها.\n• اختر الأيقونة المناسبة لفتح متصفح الإنترنت.\n• اختر الملف الرقمي المناسب للصورة أو الصوت أو الفيديو.", "  الطالب.\n2. تنفيذ النشاط العملي أو المطابقة/التصنيف الوارد في الدرس تدريجيًا.\n3. تقديم نموذج أمام الطلاب ثم إتاحة تطبيق فردي أو ثنائي مع المتابعة.", "formative": "• صل أجزاء الحاسوب بالصورة.\n• لون المفتاح أو الجزء المناسب.\n• ضع علامة أمام السلوك الصحيح.\n• ميز بين النقرة والنقرة المزدوجة.", "closing": "• ورقة/نشاط مراجعة شامل للوحدة.\n• مهمة قصيرة للتحقق من المهارات الأساسية.", "homework": "• مراجعة مهارات الوحدة الأولى استعدادًا للتطبيق."}}, "1.6": {"t": "لنطبق معًا", "f": {"terms": "• تحريك الفأرة\n• النقر مرة واحدة\n• النقر مرتين\n• استخدام لوحة المفاتيح\n• كتابة الأحرف والأرقام\n• Spacebar\n• Backspace", "intro": "• تهيئة عملية أمام جهاز الحاسوب: ما المهارة التي سنطبقها أولًا؟\n• عرض نموذج سريع ثم إتاحة وقت للتطبيق الفردي.", "obj": "1. يطبق الطالب مهارات استخدام الفأرة في أنشطة عملية.\n2. يستخدم النقرة الواحدة والنقرة المزدوجة.\n3. يكتب الأحرف والأرقام على لوحة المفاتيح.\n4. يستخدم مفتاح المسافة Backspace بطريقة صحيحة.\n5. يستخدم كلتا يديه بطريقة مناسبة أثناء الكتابة.", "procedures": "1. شرح المفهوم من خلال صور الكتاب ومناقشة أمثلة قريبة من حياة الطالب.\n2. تنفيذ النشاط العملي أو المطابقة/التصنيف الوارد في الدرس تدريجيًا.\n3. تقديم نموذج أمام الطلاب ثم إتاحة تطبيق فردي أو ثنائي مع المتابعة.", "formative": "• نفذ نقرة واحدة على الهدف.\n• افتح التطبيق بالنقرة المزدوجة.\n• اكتب الأحرف والأرقام بالترتيب.\n• أضف مسافة واحذف حرفًا باستخدام المفتاح المناسب.", "closing": "• تطبيق عملي متدرج من الفأرة إلى لوحة المفاتيح.\n• تقويم أداء فردي وفق قائمة ملاحظة بسيطة.", "homework": "• تطبيق مهارات الفأرة ولوحة المفاتيح عمليًا."}}, "2.1": {"t": "مقدمة إلى الرسم الرقمي", "f": {"terms": "• الرسم الرقمي\n• تطبيق الرسام Paint\n• الفأرة بوصفها قلمًا وفرشاة رسم\n• البكسل Pixel\n• مزايا الرسم الرقمي: سهولة الإنشاء، سهولة المشاركة، توفر أدوات متعددة", "intro": "• عرض رسم رقمي بسيط وسؤال: كيف يمكن أن نرسم باستخدام الحاسوب؟\n• تكبير صورة بسيطة لتوضيح وحدات البكسل.\n• مقارنة الرسم الرقمي بالرسم على الورق من حيث الأدوات.", "obj": "1. يتعرف الطالب إلى مفهوم الرسم الرقمي.\n2. يتعرف إلى ت n2. تطبيق المهارة في Paint مع توجيه الطلاب إلى استخدام الأداة المناسبة.\n3. مشاركة بعض الأعمال ومناقشة الأدوات والخطوات المستخدمة.", "formative": "• طابق حجم الحدود بالدائرة الصحيحة.\n• طابق أشكال الرسم بأدواتها.\n• حدد الأدوات التي استخدمتها في الرسم.", "closing": "• نشاط تطبيقي يجمع بين شكلين أو أكثر.\n• تقويم ذاتي باستخدام علامات بسيطة.", "homework": "• التدرب على دمج الأشكال واختيار الأدوات المناسبة."}}, "2.6": {"t": "الرسم الحر", "f": {"terms": "• الرسم الحر\n• أدوات Paint\n• الأشكال والألوان\n• التفاصيل\n• الحفظ", "intro": "• عرض نماذج رسم بسيطة من الكتاب وإتاحة فرصة للتخيل.\n• سؤال: ماذا تريد أن ترسم اليوم؟", "obj": "1. يخطط الطالب لرسم رقمي من اختياره.\n2. يستخدم أدوات الرسام لرسم أشكال وتلوينها.\n3. يدمج أكثر من شكل ويضيف تفاصيل إلى الرسم.\n4. يعدل رسمه باستخدام الممحاة أو التراجع عند الحاجة.\n5. يحفظ عمله ويعرضه للآخرين.", "procedures": "1. عرض الأداة أو المهارة على الشاشة التفاعلية وتنفيذها خطوة بخطوة.\n2. تطبيق المهارة في Paint مع توجيه الطلاب إلى استخدام الأداة المناسبة.\n3. مشاركة بعض الأعمال ومناقشة الأدوات والخطوات المستخدمة.", "formative": "• ارسم رسمة جميلة من اختيارك.\n• أضف تفاصيل إلى الرسم.\n• أضف رسمة من مخيلتك واحفظها.", "closing": "• مشروع فردي: رسم حر باستخدام Paint.\n• عرض بعض الأعمال ومناقشة الأدوات المستخدمة.", "homework": "• ممارسة الرسم الحر وتوظيف مهارات الوحدة الثانية."}}, "3.1": {"t": "الإنترنت", "f": {"terms": "• الإنترنت\n• الاتصال بالحاسوب وأجهزة الحاسوب الأخرى\n• الاتصال السلكي واللاسلكي\n• استخدامات الإنترنت\n• تصفح مواقع الويب\n• البحث عن المعلومات\n• قواعد الأمان\n• اسم المستخدم وكلمة المرور", "intro": "• عرض صورة شبكة أجهزة وسؤال: كيف يمكن للأجهزة أن تتواصل معًا؟\n• مناقشة استخدامات الإنترنت التي يعرفها الطلاب.\n• عرض مواقف بسيطة للسلوك الآمن وغير الآمن.", "obj": "1. يشرح الطالب بصورة مبسطة فكرة عمل الإنترنت.\n2. يذكر بعض استخدامات الإنترنت.\n3. يميز بين الاتصال السلكي واللاسلكي.\n4. يتصفح الإنترنت مع الالتزام بقواعد الأمان.\n5. يحافظ على معلوماته الشخصية وكلمة المرور ويطلب المساعدة من والديه أو المعلمة عند الحاجة.", "procedures": "1. عرض موقف أو صورة مرتبطة بالإنترنت ومناقشة الفكرة بلغة مبسطة.\n2. تنفيذ خطوات التصفح أو البحث أو التواصل بصورة موجهة وتحت إشراف المعلمة.\n3. التأكيد على قواعد الأمان وعدم مشاركة المعلومات الشخصية وطلب المساعدة عند الحاجة.", "formative": "• صل الأجهزة بالإنترنت في الخريطة.\n• اذكر استخدامًا واحدًا للإنترنت.\n• ميز بين الاتصال السلكي واللاسلكي.\n• ضع علامة على السلوك الآمن عند استخدام الإنترنت.", "closing": "• نشاط مواقف: ماذا أفعل إذا رأيت شيئًا غير مريح على الإنترنت؟\n• بطاقة خروج: اذكر قاعدة أمان واحدة.", "homework": "• مراجعة استخدامات الإنترنت وقواعد الأمان والتصفح الآمن."}}, "3.2": {"t": "استمتع", "f": {"terms": "• متصفح الإنترنت\n• Google Chrome\n• Safari\n• Edge\n• Firefox\n• موقع الويب\n• زيارة مواقع الويب", "intro": "• عرض رموز المتصفحات ومطالبة الطلاب بالتعرف عليها.\n• فتح متصفح أمام الطلاب والتعرف إلى شريط العنوان.\n• زيارة موقع ويب تعليمي مناسب بإشراف المعلمة.", "obj": "1. يتعرف الطالب إلى متصفح الإنترنت.\n2. يسمي بعض متصفحات الإنترنت مثل Google Chrome وSafari وEdge وFirefox.\n3. يفتح متصفحًا ويزور موقع ويب.\n4. يتبع خطوات بسيطة لزيارة موقع ويب آمن.", "procedures": "1. عرض موقف أو صورة مرتبطة بالإنترنت ومناقشة الفكرة بلغة مبسطة.\n2. تنفيذ خطوات التصفح أو البحث أو التواصل بصورة موجهة وتحت إشراف المعلمة.\n3. التأكيد على قواعد الأمان وعدم مشاركة المعلومات الشخصية وطلب المساعدة عند الحاجة.", "formative": "• اكتب اسم موقع الويب.\n• اختر الأداة التي تمكنك من تصفح الإنترنت.\n• رتب خطوات زيارة موقع ويب.\n• قم بزيارة موقع مناسب بإشراف المعلمة.", "closing": "• نشاط عملي: فتح المتصفح وكتابة عنوان موقع مناسب.\n• تقويم شفهي حول الفرق بين المتصفح وموقع الويب.", "homework": "• التدرب على فتح المتصفح وزيارة مواقع الويب الآمنة."}}, "3.3": {"t": "تواصل", "f": {"terms": "• البريد الإلكتروني\n• التواصل عبر الإنترنت\n• الرسائل\n• الملفات الرقمية المرفقة\n• النص والصوت والصورة والفيديو\n• مزايا البريد الإلكتروني", "intro": "• عرض نموذج رسالة قصيرة وسؤال: كيف يمكن إرسال رسالة لصديق؟\n• مناقشة أنواع الملفات التي يمكن إرسالها عبر البريد الإلكتروني.\n• التأكيد على التواصل المسؤول وتحت إشراف الأسرة/المعلمة.", "obj": "1. يتعرف الطالب إلى البريد الإلكتروني وسيلة للتواصل.\n2. يميز بعض أنواع الملفات الرقمية التي يمكن إرسالها.\n3. يحدد بعض مزايا البريد الإلكتروني مثل سرعة تبادل الرسائل.\n4. ينفذ نشاط إرسال رسالة إلكترونية تعليمية وفق توجيهات المعلمة.", "procedures": "1. عرض موقف أو صورة مرتبطة بالإنترنت ومناقشة الفكرة بلغة مبسطة.\n2. تنفيذ خطوات التصفح أو البحث أو التواصل بصورة موجهة وتحت إشراف المعلمة.\n3. التأكيد على قواعد الأمان وعدم مشاركة المعلومات الشخصية وطلب المساعدة عند الحاجة.", "formative": "• ضع علامة على الملفات التي يمكن إرسالها عبر البريد الإلكتروني.\n• ما وسيلة التواصل التي تستخدم الرسائل الإلكترونية؟\n• رتب خطوات إعداد رسالة بسيطة.", "closing": "• نشاط محاكاة: إعداد رسالة لصديق وإرفاق صور لحيوانات مفضلة.\n• مراجعة مكونات الرسالة: من، إلى، الموضوع، النص والمرفقات.", "homework": "• مراجعة البريد الإلكتروني وأنواع الملفات التي يمكن إرسالها."}}, "3.4": {"t": "ابحث", "f": {"terms": "• البحث عن المعلومات\n• محرك البحث Google\n• كلمات البحث\n• نتائج البحث\n• مواقع الويب\n• البحث عن الحيوانات والأماكن", "intro": "• سؤال: كيف نبحث عن معلومات عن حيوان أو مكان؟\n• عرض صفحة بحث Google والتعرف إلى خانة البحث.\n• اختيار كلمات بحث بسيطة وواضحة.", "obj": "1. يستخدم الطالب محرك بحث للوصول إلى معلومات حول موضوع بسيط.\n2. يفتح متصفح Google Chrome ويصل إلى محرك البحث.\n3. يكتب كلمات بحث مناسبة.\n4. يختار نتيجة بحث مناسبة تحت إشراف المعلمة.\n5. يستخرج معلومات بسيطة حول الحيوانات البرية في سلطنة عمان.", "procedures": "1. عرض موقف أو صورة مرتبطة بالإنترنت ومناقشة الفكرة بلغة مبسطة.\n2. تنفيذ خطوات التصفح أو البحث أو التواصل بصورة موجهة وتحت إشراف المعلمة.\n3. التأكيد على قواعد الأمان وعدم مشاركة المعلومات الشخصية وطلب المساعدة عند الحاجة.", "formative": "• رتب خطوات البحث.\n• اكتب كلمات بحث مناسبة.\n• ابحث عن الحيوانات البرية في سلطنة عمان.\n• اكتب أسماء ثلاثة حيوانات أعجبتك.", "closing": "• نشاط بحث موجه حول الحيوانات البرية في سلطنة عمان.\n• مشاركة النتائج شفهيًا مع مراعاة الأمان أثناء التصفح.", "homework": "• التدرب على البحث الموجه عن معلومات بسيطة عبر الإنترنت."}}}, "g4s1": {"1.1": {"t": "كيفية عمل جهاز الحاسوب", "f": {"terms": "• نظام جهاز الحاسوب\n• المكونات المادية (Hardware)\n• البرمجيات (Software)\n• نظام التشغيل (Operating System)\n• التطبيقات (Applications)\n• أجهزة الإدخال\n• أجهزة المعالجة والتخزين\n• أجهزة الإخراج\n• عمليات الإدخال والمعالجة والتخزين والإخراج (IPO)", "intro": "• ملاحظة جهاز الحاسوب ومكوناته من خلال الصور الواردة في الدرس.\n• سؤال تمهيدي: ما الفرق بين الأجزاء التي يمكن لمسها والبرامج التي نستخدمها؟\n• استحضار خبرة الطالب السابقة في استخدام لوحة المفاتيح والفأرة والشاشة.", "procedures": "1. التعرف إلى نظام جهاز الحاسوب بوصفه مجموعة أجزاء تعمل معًا لمعالجة البيانات وتخزينها وعرض النتائج.\n2. التمييز بين المكونات المادية والبرمجيات.\n3. تصنيف المكونات المادية إلى: أجهزة إدخال، وأجهزة معالجة وتخزين، وأجهزة إخراج.\n4. التعرف إلى أمثلة البرمجيات: أنظمة التشغيل والتطبيقات.\n5. فهم خطوات عمل الحاسوب وفق تسلسل الإدخال ثم المعالجة ثم الإخراج، مع ارتباط التخزين بالبيانات.\n6. تطبيق أمثلة الكتاب على عمليات الإدخال والمعالجة والإخراج، مثل إدخال نص أو صورة وعرض النتيجة.\n7. تنفيذ تدريبات المطابقة وتصنيف الأجهزة وفق الفئة التي تنتمي إليها.", "formative": "• صنّف: لوحة المفاتيح، الماسح الضوئي، الشاشة، الطابعة، المعالج ورقاقات الذاكرة.\n• ميّز بين Hardware وSoftware مع ذكر مثال من الدرس.\n• رتّب مراحل IPO: إدخال، معالجة، إخراج، مع مراعاة التخزين كما ورد في المحتوى.\n• حدّد جهاز الإدخال أو الإخراج المناسب لمهمة معطاة.", "closing": "• نشاط شفهي/كتابي: اشرح باختصار كيف يعمل جهاز الحاسوب من إدخال البيانات حتى ظهور النتائج.\n• مراجعة مخرجات الدرس: التمييز بين المكونات المادية والبرمجيات ووصف كيفية عمل جهاز الحاسوب.", "homework": "• يراجع الطالب الفرق بين المكونات المادية والبرمجيات، وتصنيف أجهزة الحاسوب إلى إدخال ومعالجة/تخزين وإخراج، وتسلسل عمل الحاسوب."}}, "1.2": {"t": "أجهزة الوسائط المتعددة", "f": {"terms": "• أجهزة الوسائط المتعددة\n• التقاط الفيديو\n• مسح الصور\n• التقاط الصوت\n• التقاط الصور\n• توصيل أجهزة الوسائط المتعددة بالحاسوب\n• الاتصال السلكي واللاسلكي\n• امتداد الملف\n• امتدادات ملفات الوسائط المتعددة\n• حجم الملف\n• وحدات قياس حجم الملفات", "intro": "• عرض صور أجهزة الوسائط المتعددة الواردة في الكتاب ومناقشة الوظيفة التي يؤديها كل جهاز.\n• سؤال تمهيدي: أي جهاز يمكن أن نستخدمه لالتقاط الصوت؟ وأي جهاز لالتقاط الفيديو؟\n• ربط الدرس بالمواقف اليومية التي نستخدم فيها الهاتف أو الكاميرا أو الميكروفون.", "procedures": "1. التعرف إلى أجهزة الوسائط المتعددة والوظائف التي تؤديها: التقاط الفيديو، مسح الصورة، التقاط الصوت والصورة.\n2. مقارنة وظائف الأجهزة من خلال الجدول المصور في الكتاب.\n3. التعرف إلى طرق توصيل أجهزة الوسائط المتعددة بالحاسوب باستخدام الأسلاك أو الاتصال اللاسلكي.\n4. فهم أن نقل الملفات بين الأجهزة والحاسوب يتيح حفظ الوسائط واستخدامها.\n5. التعرف إلى امتداد الملف ودوره في التعرف إلى نوع الملف.\n6. تمييز الامتدادات الواردة في الدرس: jpg وpng وgif للصور/الرسومات، mp3 للصوت، mp4 للفيديو، إضافة إلى pptx وpdf وtxt وdocx.\n7. التعرف إلى حجم الملف ووحداته: Byte وKB وMB وGB وTB.\n8. تنفيذ أنشطة مطابقة الوظائف بالأجهزة، ومطابقة الأيقونات بامتدادات الملفات، والتدرب على وحدات قياس الحجم.", "formative": "• طابق كل وظيفة مع الجهاز المناسب.\n• حدّد نوع الملف من امتداده: jpg، mp3، mp4، pptx، docx.\n• رتّب وحدات قياس حجم الملفات الواردة في الدرس.\n• اسأل الطالب عن سبب اختلاف حجم الملفات.", "closing": "• بطاقة خروج: اذكر جهازًا يلتقط الصوت، وامتداد ملف صوتي، ووحدة مناسبة لقياس حجم ملف.\n• مراجعة مخرجات الدرس المتعلقة بأنواع الملفات وحجمها وأجهزة الوسائط المتعددة.", "homework": "• يراجع الطالب وظائف أجهزة الوسائط المتعددة، امتدادات الملفات الشائعة، ووحدات قياس حجم الملفات."}}, "1.3": {"t": "التعامل مع الوسائط المتعددة", "f": {"terms": "• مسجل الصوت Sound Recorder\n• التسجيل الصوتي\n• بدء التسجيل\n• إيقاف التسجيل\n• إيقاف مؤقت للتسجيل\n• حفظ التسجيل\n• Microsoft Photos\n• عرض الصور\n• تحرير الصور\n• مشاركة الصورة\n• تكبير وتصغير الصورة", "intro": "• استماع إلى مقطع صوتي قصير أو عرض صورة، ثم سؤال الطالب عن التطبيق المناسب لإنشاء/عرض الوسائط.\n• استحضار مفهوم أجهزة الوسائط المتعددة من الدرس السابق.\n• مناقشة كيف يمكن تحويل تسجيل صوتي أو صورة إلى ملف محفوظ في الحاسوب.", "procedures": "1. التعرف إلى تطبيق Sound Recorder لإنشاء مقطع صوتي.\n2. توصيل جهاز التقاط الصوت بالحاسوب بالطريقة الموضحة في الدرس.\n3. فتح مسجل الصوت والبدء بالتسجيل، ثم إيقاف التسجيل وحفظ الملف.\n4. التعرف إلى إمكانات التعامل مع الصور في Microsoft Photos.\n5. فتح صورة ومشاهدة خيارات العرض والتحرير والمشاركة والحذف والتكبير والتصغير كما وردت في الدرس.\n6. التدرب على تسجيل مقطع صوتي ثم التعامل مع صورة باستخدام التطبيق المناسب.\n7. تنفيذ تدريبات الكتاب المتعلقة بالتسجيل وتشغيل المقطع الصوتي ومراجعة وظائف أدوات الصور.", "formative": "• رتّب خطوات إنشاء مقطع صوتي من بدء التطبيق حتى الحفظ.\n• ميّز بين Start وStop والإيقاف المؤقت في التسجيل.\n• اذكر وظيفتين من وظائف Microsoft Photos الواردة في الدرس.\n• حدّد التطبيق المناسب لإنشاء تسجيل صوتي أو التعامل مع صورة.", "closing": "• تنفيذ مهمة قصيرة: إنشاء تسجيل صوتي محفوظ، ثم فتح صورة وعرض إحدى أدوات التعامل معها.\n• مراجعة المهارات التي تم التدريب عليها في الدرس.", "homework": "• يتدرب الطالب على إنشاء مقطع صوتي باستخدام Sound Recorder، والتعامل مع الصور باستخدام Microsoft Photos."}}, "1.4": {"t": "تطبيق التأثيرات على الصور", "f": {"terms": "• مسح الصور ضوئيًا\n• Windows Scan\n• الكاميرا\n• Microsoft Photos\n• تحرير الصور\n• القص\n• إزالة العيوب/البقع\n• التدوير\n• التصفية Filters\n• السطوع\n• الألوان\n• التراجع Undo\n• حفظ الصورة", "intro": "• عرض صورة قبل وبعد التعديل ومناقشة ما الذي تغير فيها.\n• سؤال تمهيدي: كيف نحصل على نسخة رقمية من صورة ورقية؟\n• استحضار مهارات فتح الصور والتعامل معها من الدرس السابق.", "procedures": "1. التعرف إلى إمكانية مسح الصور ضوئيًا باستخدام Windows Scan.\n2. التعرف إلى استخدام جهاز ذكي/كاميرا للحصول على صورة ثم نقلها أو حفظها في الحاسوب.\n3. فتح صورة في Microsoft Photos.\n4. التدرب على إزالة أجزاء غير مرغوبة، وقص الصورة وتدويرها.\n5. تطبيق عوامل التصفية لتغيير السطوع والألوان ومظهر الصورة، مع ملاحظة مثال الأبيض والأسود والتأثيرات الأخرى الواردة في الدرس.\n6. استخدام Undo للتراجع عن التغييرات.\n7. تنفيذ نشاط الكتاب على صورة وتطبيق التعديلات بالترتيب المطلوب ثم حفظ النسخة المعدلة.", "formative": "• ما الأداة المناسبة للحصول على نسخة رقمية من صورة ورقية؟\n• حدّد الإجراء المناسب: قص، تدوير، تصفية، تراجع.\n• طبّق تصفية على صورة ثم استخدم Undo.\n• رتّب خطوات النشاط العملي الواردة في الكتاب.", "closing": "• مهمة تطبيقية: تعديل صورة بإجراء قص أو تدوير ثم تطبيق تصفية وحفظها.\n• سؤال ختامي: ما فائدة Undo عند تحرير الصورة؟", "homework": "• يراجع الطالب خطوات مسح الصور ضوئيًا وتحريرها في Microsoft Photos، مثل القص والتدوير والتصفية والتراجع."}}, "1.5": {"t": "إنشاء فيديو", "f": {"terms": "• Legacy Photos\n• مشروع فيديو جديد\n• مكتبة المشروع\n• مخطط القصة Storyboard\n• إضافة الصور ومقاطع الفيديو\n• النصوص\n• التأثيرات الحركية\n• التأثيرات الصوتية\n• الموسيقى الخلفية\n• حفظ الفيديو\n• تنظيم الملفات\n• اختيار الإضاءة المناسبة", "intro": "• عرض مجموعة صور وسؤال الطالب: كيف يمكن جمعها في فيديو واحد؟\n• مراجعة امتدادات الصور والفيديو والصوت من الدرس السابق.\n• مناقشة عناصر الفيديو التي يمكن أن تجعله واضحًا وجذابًا.", "procedures": "1. فتح تطبيق Legacy Photos واختيار إنشاء مشروع فيديو جديد.\n2. إعطاء اسم للمشروع وإضافة ملفات الفيديو من جهاز الحاسوب.\n3. وضع الملفات في مكتبة المشروع ثم في مخطط القصة.\n4. تنظيم الصور ومقاطع الفيديو داخل المشروع.\n5. إضافة نصوص توضيحية إلى الفيديو عند الحاجة.\n6. تطبيق تأثيرات مرئية وحركية على العناصر، ومعاينة النتيجة.\n7. إضافة تأثيرات صوتية أو موسيقى خلفية من المكتبة أو ملف صوتي محفوظ، وفق ما يوضحه الكتاب.\n8. التعرف إلى ممارسات تسجيل الفيديو الواردة في الدرس، ومنها استخدام إضاءة مناسبة وتجنب الإضاءة القوية المباشرة.\n9. تنفيذ المشروع التوعوي في الكتاب حول المحافظة على نظافة البيئة.", "formative": "• رتّب خطوات إنشاء مشروع فيديو جديد.\n• ما الفرق بين مكتبة المشروع ومخطط القصة في تسلسل العمل؟\n• حدّد أين تضاف النصوص والتأثيرات والمؤثرات الصوتية.\n• اذكر مبدأين من الممارسات الجيدة لتسجيل الفيديو الواردة في الدرس.", "closing": "• إنشاء مقطع فيديو قصير من صور/مقاطع متاحة، وإضافة نص وتأثير مناسب ثم حفظ المشروع.\n• عرض المشروع ومراجعة المهارات التي تم تطبيقها.", "homework": "• يتدرب الطالب على إنشاء فيديو باستخدام Legacy Photos، وتنظيم الوسائط وإضافة النصوص والتأثيرات والصوت."}}, "2.1": {"t": "إنشاء عرض تقديمي", "f": {"terms": "• العرض التقديمي\n• Microsoft PowerPoint\n• الشريحة\n• نسق Themes\n• العنوان\n• النص\n• القوائم النقطية/الرقمية\n• WordArt\n• حفظ العرض\n• تشغيل العرض التقديمي", "intro": "• عرض شريحة بسيطة وسؤال الطلاب عن الهدف من استخدام العروض التقديمية.\n• مناقشة أمثلة لمواقف يمكن فيها عرض فكرة أو معلومات أمام الآخرين.\n• استحضار مهارة كتابة النص وتنظيمه في مستند رقمي.", "procedures": "1. التعرف إلى Microsoft PowerPoint بوصفه تطبيقًا لتصميم العروض التقديمية.\n2. إنشاء عرض تقديمي جديد وإدراج شريحة ثانية.\n3. اختيار نسق مناسب للعرض من تبويب Design.\n4. إضافة عنوان ونص إلى الشرائح.\n5. إنشاء قائمة باستخدام التعداد النقطي أو الرقمي لتنظيم المعلومات.\n6. استخدام WordArt لتنسيق عنوان أو نص بطريقة جذابة.\n7. مراجعة مبادئ تنظيم العرض والتركيز على النقاط الرئيسة وتجنب كثرة النصوص.\n8. حفظ العرض وتشغيله ومراجعة الشرائح.", "formative": "• أنشئ عرضًا من شريحتين كما في خطوات الكتاب.\n• اختر نسقًا مناسبًا ثم أضف عنوانًا وقائمة.\n• حوّل مجموعة عبارات إلى قائمة نقطية أو رقمية.\n• ميّز وظيفة WordArt والنسق Theme.", "closing": "• عرض قصير من شرائح يتضمن عنوانًا وقائمة منظمة مع نسق مناسب.\n• تقويم ذاتي: هل العنوان واضح؟ هل المعلومات منظمة؟ هل النص مختصر؟", "homework": "• يراجع الطالب إنشاء عرض تقديمي في PowerPoint، اختيار النسق، تنظيم النص في قوائم، واستخدام WordArt."}}, "2.2": {"t": "التعامل مع الصور", "f": {"terms": "• إدراج الصور في PowerPoint\n• تحديد الصورة\n• تبويب تنسيق الصورة Format Picture\n• أنماط الصور Picture Styles\n• الحدود\n• تغيير مظهر الصورة", "intro": "• عرض شريحة تحتوي على صورة وأخرى بلا صورة، ومناقشة أيهما يساعد على توضيح الفكرة.\n• سؤال تمهيدي: كيف نضيف صورة إلى شريحة؟ وكيف نغير مظهرها؟\n• مراجعة مهارة تحديد عنصر داخل الشريحة.", "procedures": "1. إدراج صورة في الشريحة.\n2. تحديد الصورة والتأكد من ظهور أدوات تنسيقها.\n3. فتح تبويب Format Picture.\n4. استعراض أنماط الصور واختيار نمط مناسب، مثل النمط المستدير الأبيض الوارد في المثال.\n5. ملاحظة أثر النمط والحدود على مظهر الصورة.\n6. ت النسق\n• إضافة النصوص والصور\n• الشريحة الختامية\n• التأثيرات الانتقالية والحركية", "intro": "• مناقشة فكرة المشروع الواردة في الكتاب حول إنشاء عرض تقديمي عن الطعام الصحي بالتعاون مع مجموعة من الزملاء.\n• تحديد ما يحتاجه العرض: عنوان، معلومات، صور، تنظيم للشرائح.\n• تذكير الطلاب بالمهارات التي تعلموها في الوحدة الثانية.", "procedures": "1. العمل ضمن مجموعة لإنشاء عرض تقديمي عن الطعام الصحي.\n2. البحث عن معلومات مرتبطة بالموضوع وفق ما يطلبه المشروع.\n3. اختيار نسق مناسب للعرض.\n4. إضافة معلومات وصور إلى الشرائح.\n5. إضافة نصوص إلى الشرائح التي تحتوي على صور عند الحاجة، وتمثيل المعلومات بصريًا بطريقة مناسبة.\n6. إنشاء شريحة ختامية تلخص العرض.\n7. إضافة تأثيرات انتقالية بين الشرائح وتأثيرات حركية للنصوص والصور عند الحاجة.\n8. مراجعة العرض وتشغيله والتأكد من توظيف المهارات المكتسبة.", "formative": "• تحقق من وجود عنوان واضح للعرض.\n• تحقق من وجود معلومات وصور مناسبة للموضوع.\n• هل أضيفت شريحة ختامية؟\n• هل استُخدمت التأثيرات الانتقالية والحركية بطريقة مناسبة؟", "closing": "• عرض المشروع أمام الزملاء ومراجعة المهارات التي تم توظيفها.\n• تقويم جماعي لمدى تنظيم الشرائح ووضوح المعلومات.", "homework": "• يطبق الطالب مهارات الوحدة الثانية في مشروع تعاوني لإنشاء عرض تقديمي منظم ومدعّم بالصور والتأثيرات المناسبة."}}, "3.1": {"t": "البريد الإلكتروني", "f": {"terms": "• البريد الإلكتروني Email\n• حساب البريد الإلكتروني\n• عنوان البريد الإلكتروني\n• المستلم To\n• الموضوع Subject\n• محتوى الرسالة\n• المرفقات\n• قواعد استخدام البريد الإلكتروني\n• التحية\n• الخاتمة/التوقيع", "intro": "• مناقشة مواقف التواصل مع صديق أو قريب بعيد، وسؤال الطلاب عن وسيلة التواصل المناسبة عبر الإنترنت.\n• عرض نموذج رسالة بريد إلكتروني في الكتاب والتعرف إلى أجزائها.\n• مناقشة أهمية كتابة الرسالة بصورة واضحة ومهذبة.", "procedures": "1. التعرف إلى البريد الإلكتروني بوصفه وسيلة لإرسال الرسائل واستقبالها عبر شبكة الإنترنت.\n2. التعرف إلى عناصر الرسالة: عنوان المستلم، الموضوع، محتوى الرسالة، والخاتمة/التوقيع.\n3. التعرف إلى إمكانية إرفاق الملفات عند الحاجة.\n4. تطبيق الإرشادات الواردة في الكتاب لكتابة رسالة بريد إلكتروني سليمة: تحديد المستلم، كتابة موضوع واضح، محتوى قصير ومهذب، والبدء بالتحية وإنهاء الرسالة باسم المرسل أو توقيعه.\n5. مناقشة قواعد الاستخدام السليم للبريد الإلكتروني.\n6. تحليل النموذج الوارد في الكتاب والتعرف إلى From وTo والموضوع ومحتوى الرسالة.", "formative": "• سمِّ أجزاء رسالة البريد الإلكتروني.\n• اكتب موضوعًا مناسبًا لرسالة معطاة.\n• ميّز بين To وFrom.\n• حدّد المواضع التي يمكن فيها إرفاق ملف.", "closing": "• كتابة نموذج رسالة بريد إلكتروني وفق الإرشادات الواردة في الكتاب، دون إرسال فعلي إذا لم يكن ذلك مطلوبًا.\n• مراجعة قواعد الاستخدام السليم للرسائل الإلكترونية.", "homework": "• يراجع الطالب أجزاء البريد الإلكتروني وقواعد كتابة رسالة قصيرة ومهذبة وإمكانية إرفاق الملفات."}}, "3.2": {"t": "التواصل عبر البريد الإلكتروني", "f": {"terms": "• تطبيق Mail\n• إنشاء رسالة جديدة\n• البريد الوارد Inbox\n• قراءة الرسائل\n• الرد على الرسالة\n• إرفاق صورة\n• حفظ المرفق\n• إرسال الرسالة", "intro": "• مراجعة أجزاء رسالة البريد الإلكتروني من الدرس السابق.\n• عرض مثال لرسالة واردة وسؤال الطالب: كيف نفتحها؟ وكيف نرد عليها؟\n• مناقشة فائدة إرسال صورة أو ملف عبر البريد الإلكتروني.", "procedures": "1. فتح تطبيق Mail من قائمة Start.\n2. اختيار New mail لإنشاء رسالة جديدة.\n3. التعرف إلى البريد الوارد Inbox وقراءة الرسائل الجديدة.\n4. فتح رسالة وقراءة محتواها.\n5. الرد على الرسالة باستخدام الخيار المناسب.\n6. إرفاق صورة أو ملف بالرسالة عند الحاجة.\n7. حفظ الصورة/المرفق المستلم وفق النشاط الوارد في الكتاب.\n8. التدرب على التواصل عبر البريد الإلكتروني من خلال إرسال رسالة والرد عليها ضمن بيئة تعليمية آمنة.", "formative": "• رتّب خطوات فتح تطبيق Mail وإنشاء رسالة جديدة.\n• أين تظهر الرسائل الجديدة؟\n• كيف تفتح رسالة واردة وتقرأ محتواها؟\n• كيف ترفق صورة برسالة؟ وكيف تحفظ المرفق المستلم؟", "closing": "• تنفيذ محاكاة تعليمية: فتح رسالة، قراءتها، الرد عليها، وإرفاق صورة وفق خطوات الكتاب.\n• مراجعة مخرجات الوحدة المتعلقة بكتابة الرسائل وقراءتها والرد عليها والتعامل مع المرفقات.", "homework": "• يتدرب الطالب على فتح البريد الوارد وقراءة الرسائل والرد عليها وإرفاق الصور وحفظ المرفقات. مراجع المحتوى داخل الكتاب\n• الوحدة الأولى «حاسوبي»: الدروس 1.1 إلى 1.5.\n• الوحدة الثانية «لنعرِض أفكارنا»: الدروس 2.1 إلى 2.4.\n• الوحدة الثالثة «عالمي المتصل»: الدرس 3.1 والدرس 3.2.\n• تم الاستناد إلى الصفحات المصورة والأنشطة العملية والنصوص التعريفية الواردة في الكتاب المرفق."}}}, "g3s1": {"1.1": {"t": "أجهزة التفاعل مع الحاسوب", "f": {"terms": "• لوحة المفاتيح والفأرة\n• لوحة اللمس Touchpad\n• شاشة اللمس Touchscreen\n• جهاز التحكم بالألعاب Game Controller\n• نظارات الواقع الافتراضي VR Glasses\n• قفازات الواقع الافتراضي VR Gloves\n• التقنيات المساعدة Assistive Technology\n• لوحة مفاتيح برايل\n• فأرة الرأس Head Mouse\n• التعرف إلى الصوت Speech Recognition", "intro": "• عرض صور لأجهزة تفاعل مختلفة، وطرح سؤال: هل نتفاعل مع الحاسوب باستخدام لوحة المفاتيح والفأرة فقط؟\n• مراجعة سريعة لوظائف الفأرة ولوحة المفاتيح.\n• مناقشة أمثلة من الحياة اليومية لأجهزة تعتمد اللمس أو الحركة أو الصوت.", "procedures": "1. التعرف إلى أن هناك أجهزة مختلفة للتفاعل مع الحاسوب، وليس جميع المستخدمين يستخدمون الأجهزة نفسها.\n2. التعرف إلى لوحة اللمس في الحاسوب المحمول وشاشة اللمس.\n3. التعرف إلى جهاز التحكم بالألعاب ونظارات الواقع الافتراضي وقفازات الواقع الافتراضي.\n4. مناقشة التقنيات المساعدة التي تساعد الأشخاص الذين يعانون من إعاقات بصرية أو سمعية أو نطقية أو حركية أو عقلية.\n5. التعرف إلى لوحة مفاتيح برايل بوصفها وسيلة لإدخال البيانات للأشخاص المكفوفين أو ضعيفي الرؤية.\n6. التعرف إلى فأرة الرأس والتعرف إلى الصوت بوصفهما طريقتين للتفاعل مع الحاسوب.\n7. تنفيذ أنشطة الكتاب: مطابقة جهاز التفاعل باسمه، وتحديد التقنيات المساعدة، واستكمال العبارات.", "formative": "• طابق الجهاز مع وظيفته.\n• حدد الأجهزة التي تستخدم اللمس أو الحركة أو الصوت.\n• ما المقصود بالتقنيات المساعدة؟\n• اذكر مثالًا لجهاز يساعد شخصًا ضعيف الرؤية أو الحركة.", "closing": "• بطاقة خروج: اذكر جهاز تفاعل واحدًا وتقنية مساعدة واحدة ووظيفة كل منهما.\n• مراجعة التصنيف الذي توصل إليه الطلاب من خلال نشاط الكتاب.", "homework": "• يراجع الطالب أجهزة التفاعل مع الحاسوب، وبعض التقنيات المساعدة ووظائفها."}}, "1.2": {"t": "تنظيم الملفات والمجلدات", "f": {"terms": "• الملف File\n• المجلد Folder\n• المجلد الفرعي Subfolder\n• تسمية الملفات والمجلدات\n• امتداد الملف\n• أيقونة الملف\n• إعادة تسمية Rename\n• نقل الملفات والمجلدات\n• نسخ الملفات والمجلدات\n• حجم الملف\n• البحث عن الملفات", "intro": "• عرض مجلد يحتوي على ملفات غير منظمة ومناقشة صعوبة العثور على ملف محدد.\n• سؤال: كيف يمكن أن ننظم ملفاتنا بطريقة تسهّل الوصول إليها؟\n• ربط المفهوم بأمثلة دراسية مثل مجلد للعلوم وآخر للرياضيات.", "procedures": "1. التعرف إلى الملف بوصفه وحدة لتخزين البيانات والمعلومات على جهاز الحاسوب.\n2. التعرف إلى أنواع الملفات مثل ملف نصي وملف صورة وملف فيديو.\n3. التعرف إلى تسمية الملف، والتمييز بين الاسم والامتداد والأيقونة.\n4. التدرب على اختيار أسماء واضحة ومميزة للملفات والمجلدات، وتجنب الرموز التي يمنع استخدامها في التسمية.\n5. التعرف إلى المجلد والمجلد الفرعي وتنظيم الملفات داخلهما.\n6. إنشاء مجلدات فرعية وترتيب الملفات فيها وفق الموضوع أو المادة.\n7. التدرب على إعادة تسمية المجلدات والملفات، ونقلها وسحبها وإفلاتها، والتمييز بين النقل والنسخ.\n8. التعرف إلى حجم الملف والبحث عن الملفات والتحقق من مكان حفظها.\n9. تنفيذ نشاط الكتاب بإنشاء مجلدات مثل «صور عن بلادي» وتنظيم الملفات بداخلها.", "formative": "• صنّف أسماء الملفات إلى أسماء واضحة وغير مناسبة.\n• حدّد الاسم والامتداد في ملف معروض.\n• رتّب ملفات المواد الدراسية داخل مجلدات مناسبة.\n• ميّز بين نقل الملف ونسخه.\n• أنشئ مجلدًا فرعيًا داخل مجلد رئيسي.", "closing": "• مهمة عملية: إنشاء مجلد رئيسي ومجلدات فرعية، ثم نقل ملف إلى المكان الصحيح وإعادة تسميته.\n• سؤال ختامي: ما فائدة تنظيم الملفات والمجلدات؟", "homework": "• يتدرب الطالب على إنشاء المجلدات والمجلدات الفرعية، وتسمية الملفات وتنظيمها ونقلها ونسخها."}}, "1.3": {"t": "أجهزة الطباعة والالتقاط", "f": {"terms": "• الطباعة من الشاشة إلى الورق\n• الطابعة Printer\n• الطابعة النافثة للحبر Inkjet\n• طابعة الليزر Laser\n• الطابعة الحرارية Thermal\n• الكاميرا الرقمية Digital Camera\n• التقاط الصور والفيديو\n• بطاقة الذاكرة\n• USB\n• Wi-Fi", "intro": "• عرض صور لعدة طابعات وكاميرا رقمية وسؤال الطلاب عن وظيفة كل جهاز.\n• مناقشة الفرق بين ما نراه على الشاشة وما يمكن الحصول عليه مطبوعًا على الورق.\n• ربط الكاميرا الرقمية بما تعلمه الطلاب عن الملفات والصور.", "procedures": "1. التعرف إلى الطابعة بوصفها جهازًا يتيح طباعة النصوص والأرقام والصور والرسومات على الورق.\n2. التعرف إلى خطوات الطباعة الأساسية: توصيل الطابعة بالحاسوب، تثبيت برنامج التشغيل عند الحاجة، ووضع الورق.\n3. التعرف إلى الأنواع الثلاثة الأساسية للطابعات الواردة في الكتاب: النافثة للحبر، الليزر، والحرارية، ومجالات استخدامها.\n4. مناقشة بعض ممارسات المحافظة على البيئة المرتبطة باستخدام الطابعات مثل إعادة تعبئة أو تدوير العبوات عند الإمكان.\n5. التعرف إلى الكاميرا الرقمية بوصفها جهازًا يلتقط الصور ومقاطع الفيديو ويحفظها على بطاقة الذاكرة.\n6. التعرف إلى نقل الصور من الكاميرا إلى الحاسوب باستخدام بطاقة الذاكرة أو USB أو Wi-Fi كما يوضح الكتاب.\n7. تنفيذ أنشطة الكتاب الخاصة بمطابقة الجهاز بالوظيفة والتعرف إلى أنواع الطابعات والكاميرا.", "formative": "• طابق نوع الطابعة مع مجال الاستخدام الوارد في الدرس.\n• ما الخطوات الأساسية قبل طباعة ملف؟\n• اذكر وسيلة يمكن استخدامها لنقل الصور من الكاميرا إلى الحاسوب.\n• ميّز بين الطابعة والكاميرا الرقمية من حيث الوظيفة.", "closing": "• نشاط تطبيقي/تمثيلي: اختر نوع الطابعة المناسب لموقف محدد، ثم اشرح طريقة نقل صورة من الكاميرا إلى الحاسوب.\n• مراجعة وظائف أجهزة الطباعة والالتقاط.", "homework": "• يراجع الطالب أنواع الطابعات ووظائفها، والكاميرا الرقمية وطرق نقل الصور إلى الحاسوب."}}, "2.1": {"t": "تنسيق النص", "f": {"terms": "• Microsoft Word\n• المستند النصي\n• تحديد النص\n• الخط Font\n• غامق Bold\n• مائل Italic\n• تسطير Underline\n• لون تمييز النص Text Highlight Color\n• حجم الخط\n• محاذاة النص\n• حفظ المستند", "intro": "• عرض فقرة قصيرة قبل التنسيق وبعده ومناقشة الفرق بينهما.\n• مراجعة مهارة الكتابة في مستند نصي.\n• سؤال: كيف نجعل عنوانًا أو كلمة مهمة بارزة؟", "procedures": "1. فتح مستند جديد في Microsoft Word.\n2. تحديد جزء من النص المراد تنسيقه.\n3. التعرف إلى أدوات تنسيق النص في تبويب Home.\n4. تغيير حجم الخط وشكله ولونه حسب المهمة.\n5. تطبيق Bold وItalic وUnderline على أجزاء محددة م
