 الزملاء لكتابة مقال عن طرق ترشيد استهلاك المياه.\n2. جمع الملاحظات والأفكار حول الموضوع.\n3. فتح Microsoft Word وإنشاء مستند جديد.\n4. اختيار عنوان مناسب للمقال وكتابة فقرة قصيرة.\n5. إنشاء قائمة لعرض بعض طرق ترشيد استهلاك المياه.\n6. إدراج صور مناسبة وتنسيقها داخل المستند.\n7. تطبيق إعدادات التنسيق الصحيحة على النص والصور.\n8. حفظ المستند ومراجعته قبل عرضه أو طباعته.", "formative": "• تحقق من وجود عنوان واضح.\n• تحقق من تنظيم المعلومات في فقرة وقائمة.\n• تحقق من إدراج صور مناسبة وتنسيقها.\n• راجع المستند بحثًا عن أخطاء التنسيق قبل الحفظ.", "closing": "• عرض المشروع أو مشاركته مع الزملاء، وتقويمه وفق المهارات التي تم تعلمها في الوحدة.\n• تحديد المهارة التي تم تطبيقها بصورة صحيحة والمهارة التي تحتاج إلى مزيد من التدريب.", "homework": "• يطبق الطالب مهارات Word في مشروع قصير يجمع بين الكتابة والتنسيق والقوائم وإدراج الصور."}}, "3.1": {"t": "الأمان عبر الإنترنت", "f": {"terms": "• مخاطر الإنترنت\n• قواعد الأمان عبر الإنترنت\n• المعلومات الشخصية\n• البرمجيات الضارة\n• الفيروسات\n• برنامج مكافحة الفيروسات\n• الإعلانات والمواقع غير الموثوقة\n• التواصل عبر الإنترنت", "intro": "• عرض مواقف رقمية بسيطة وسؤال الطلاب: ما التصرف الآمن في كل موقف؟\n• مراجعة معنى الإنترنت واستخداماته.\n• مناقشة أهمية حماية المعلومات الشخصية أثناء استخدام الإنترنت.", "procedures": "1. التعرف إلى بعض المخاطر التي يمكن أن يتعرض لها المستخدم عند تصفح الإنترنت.\n2. التعرف إلى قواعد الأمان لحماية المعلومات الشخصية.\n3. التعرف إلى البرمجيات الضارة والفيروسات وضرورة استخدام برنامج مخصص لمكافحتها وفق ما يورده الكتاب.\n4. مناقشة التعامل الآمن مع الإعلانات أو النوافذ التي قد تطلب بيانات أو تعرض محتوى غير موثوق.\n5. التعرف إلى سلوكيات آمنة عند التواصل مع الآخرين عبر الإنترنت.\n6. تحليل مواقف الكتاب واختيار التصرف المناسب، مثل تجاهل إعلان مشبوه وإغلاق نافذته.\n7. التدرب على تمييز السلوك الآمن من السلوك غير الآمن.", "formative": "• حدد المخاطر في موقف معروض.\n• اختر التصرف الآمن عند ظهور إعلان غير موثوق.\n• ما وظيفة برنامج مكافحة الفيروسات؟\n• اذكر قاعدة من قواعد حماية المعلومات الشخصية.\n• ميّز بين سلوك آمن وسلوك غير آمن عند التواصل عبر الإنترنت.", "closing": "• بطاقة خروج: اكتب ثلاث قواعد أمان تتبعها عند استخدام الإنترنت.\n• مراجعة المخاطر والتصرفات الآمنة التي تم تناولها في الدرس.", "homework": "• يراجع الطالب مخاطر الإنترنت وقواعد الأمان وحماية المعلومات الشخصية والتعامل مع البرمجيات الضارة."}}, "3.2": {"t": "البحث عن المعلومات", "f": {"terms": "• متصفح الإنترنت Browser\n• Google Chrome\n• Microsoft Edge\n• Safari\n• Firefox\n• محرك البحث\n• كلمات البحث\n• نتائج البحث\n• فتح صفحات الويب\n• زر Back", "intro": "• سؤال: إذا أردنا معرفة معلومات عن موضوع دراسي، كيف نبحث عنها عبر الإنترنت؟\n• عرض متصفحات مختلفة والتعرف إلى أسمائها.\n• مناقشة الفرق بين المتصفح ومحرك البحث بصورة مبسطة.", "procedures": "1. التعرف إلى متصفحات الإنترنت واستخدامها لفتح مواقع الإنترنت، مثل Google Chrome وMicrosoft Edge وSafari وFirefox.\n2. فتح المتصفح وكتابة كلمات البحث المناسبة في محرك البحث.\n3. اختيار كلمات مفتاحية مرتبطة بالموضوع للوصول إلى نتائج مناسبة.\n4. قراءة نتائج البحث واختيار النتيجة المرتبطة بالمطلوب.\n5. فتح صفحات الويب والتنقل بينها.\n6. استخدام زر Back للعودة إلى الصفحة السابقة.\n7. تنفيذ نشاط الكتاب للبحث عن معلومات مرتبطة بموضوع في سلطنة عمان، وملاحظة نتائج البحث وعدد الصفحات.", "formative": "• طابق اسم المتصفح بأيقونته.\n• اختر كلمات بحث مناسبة لموضوع معين.\n• حدد النتيجة الأقرب لموضوع البحث.\n• ما وظيفة زر Back؟\n• رتب خطوات البحث من فتح المتصفح حتى اختيار النتيجة.", "closing": "• تنفيذ بحث تعليمي بسيط باستخدام كلمات مفتاحية محددة، ثم تسجيل معلومة واحدة من نتيجة مناسبة.\n• مراجعة الفرق بين المتصفح ونتائج البحث.", "homework": "• يتدرب الطالب على استخدام متصفح الإنترنت ومحرك البحث واختيار كلمات بحث والتنقل بين النتائج."}}, "3.3": {"t": "أخلاقيات الإنترنت", "f": {"terms": "• أخلاقيات الإنترنت\n• التواصل المسؤول\n• احترام الآخرين\n• الخصوصية\n• حقوق المحتوى\n• الاستخدام المسؤول للمعلومات والصور", "intro": "• عرض موقف افتراضي حول مشاركة محتوى شخص آخر دون إذنه، وسؤال الطلاب عن التصرف الصحيح.\n• مراجعة قواعد الأمان التي تعلمها الطلاب في الدرس السابق.\n• مناقشة معنى استخدام الإنترنت بطريقة مسؤولة.", "procedures": "1. التعرف إلى أهمية اتباع الأخلاقيات عند التواصل مع الآخرين عبر الإنترنت.\n2. مناقشة السلوكيات التي تحافظ على احترام الآخرين وخصوصيتهم.\n3. التعرف إلى مسؤولية المستخدم عند استخدام النصوص والصور من المواقع.\n4. التمييز بين الاستخدام المسؤول للمحتوى وبين نسخه واستخدامه دون مراعاة مصدره أو حقوقه.\n5. تحليل مواقف من الحياة اليومية واختيار السلوك الأخلاقي المناسب.\n6. تطبيق ما تعلمه الطالب في أنشطة الكتاب المتعلقة بالتواصل عبر الإنترنت واستخدام المحتوى.", "formative": "• اختر السلوك الأخلاقي في موقف رقمي.\n• حدد السلوك الذي يحترم خصوصية الآخرين.\n• ناقش لماذا ينبغي التعامل مع النصوص والصور بمسؤولية.\n• صنف مواقف إلى سلوك مسؤول وغير مسؤول.", "closing": "• اكتب ثلاث قواعد أخلاقية تلتزم بها عند التواصل عبر الإنترنت.\n• مناقشة الإجابات وربطها بالمواقف التي تناولها الكتاب.", "homework": "• يراجع الطالب أخلاقيات استخدام الإنترنت واحترام الآخرين والخصوصية والمسؤولية عند استخدام المحتوى."}}, "3.4": {"t": "العثور على المعلومات", "f": {"terms": "• العثور على المعلومات من مواقع الإنترنت\n• Google Chrome\n• نسخ النص Copy\n• لصق النص Paste\n• Microsoft Word\n• Keep Source Formatting\n• حفظ الصور من الإنترنت\n• Saved Pictures", "intro": "• عرض نص قصير من موقع إنترنت وسؤال الطلاب: كيف يمكن استخدام معلومة منه في مستند؟\n• مراجعة البحث عن المعلومات من الدرس السابق.\n• مناقشة ضرورة قراءة المحتوى بعناية قبل استخدامه.", "procedures": "1. فتح Google Chrome والوصول إلى الموقع المحدد في نشاط الكتاب.\n2. التنقل إلى الصفحة المطلوبة واختيار النص المرتبط بالموضوع.\n3. تحديد النص المطلوب ونسخه باستخدام Copy.\n4. فتح Microsoft Word وإنشاء مستند.\n5. لصق النص باستخدام Paste واختيار Keep Source Formatting عندما يطلب النشاط ذلك.\n6. التعرف إلى طريقة حفظ صورة من موقع الإنترنت باستخدام Save image as.\n7. اختيار مجلد Pictures أو Saved Pictures وحفظ الصورة باسم مناسب.\n8. تنفيذ النشاط المتعلق بالبحث عن معلومات حول سلطنة عمان وإدراج النص/الصورة في المستند وفق خطوات الكتاب.", "formative": "• رتب خطوات نسخ النص من موقع ولصقه في Word.\n• ما وظيفة Copy؟ وما وظيفة Paste؟\n• اختر اسمًا مناسبًا للصورة المحفوظة.\n• حدد المكان المناسب لحفظ الصورة.\n• اشرح لماذا نقرأ المحتوى بعناية قبل استخدامه.", "closing": "• تنفيذ مهمة تدريبية: العثور على معلومة من الموقع، نسخ جزء مناسب إلى Word، وحفظ صورة مرتبطة بالموضوع.\n• مراجعة خطوات حفظ الصور ونسخ النصوص.", "homework": "• يتدرب الطالب على العثور على المعلومات من موقع، ونسخ النصوص وحفظ الصور واستخدامها في مستند Word."}}, "3.5": {"t": "البحث في موسوعة ويكيبيديا", "f": {"terms": "• Wikipedia\n• موسوعة ويكيبيديا\n• شريط العنوان\n• شريط البحث\n• نتائج البحث\n• مقالة ويكيبيديا\n• قائمة المحتويات\n• التنقل داخل الصفحة\n• نسخ النصوص والصور إلى Word", "intro": "• عرض اسم «Wikipedia» وسؤال الطلاب عن نوع المعلومات التي يمكن البحث عنها فيها.\n• مراجعة مهارات فتح المتصفح واستخدام شريط العنوان ومحرك البحث.\n• اختيار موضوع مألوف للطلاب للبحث عنه في الموسوعة.", "procedures": "1. فتح متصفح Google Chrome وكتابة عنوان موقع موسوعة ويكيبيديا في شريط العنوان.\n2. استخدام شريط البحث في ويكيبيديا لكتابة موضوع البحث، مثل «صلالة» كما يوضح نشاط الكتاب.\n3. قراءة نتائج البحث واختيار المقالة المناسبة.\n4. التنقل داخل المقالة واستخدام قائمة المحتويات للوصول إلى الجزء المطلوب.\n5. قراءة النصوص والصور والمعلومات بعناية قبل استخدامها.\n6. تحديد نص مناسب ونسخه، ثم فتح Microsoft Word ولصقه في المستند.\n7. حفظ صورة من المقالة وإدراجها في المستند عند تنفيذ المشروع.\n8. تنفيذ نشاط الكتاب لإنشاء مقالة عن مدينة صلالة باستخدام المعلومات والصور التي تم العثور عليها.", "formative": "• رتب خطوات البحث في ويكيبيديا.\n• ما وظيفة قائمة المحتويات؟\n• اختر المقالة المناسبة من نتائج البحث.\n• طبّق نسخ نص من المقالة إلى Word.\n• احفظ صورة مرتبطة بالموضوع بالطريقة الواردة في الكتاب.", "closing": "• إنشاء مستند قصير عن موضوع محدد باستخدام معلومات من ويكيبيديا، مع إدراج نص وصورة وتنظيمهما في Word وفق نشاط الكتاب.\n• عرض الناتج ومراجعة مهارات البحث والتنقل والنسخ والحفظ.", "homework": "• يطبق الطالب مهارات البحث في ويكيبيديا، والتنقل داخل المقالة، واستخدام المعلومات والصور في مستند Word. خلاصة الكتاب\n• الوحدة الأولى «حاسوبي»: أجهزة التفاعل مع الحاسوب، تنظيم الملفات والمجلدات، وأجهزة الطباعة والالتقاط.\n• الوحدة الثانية «هيا نكتب»: تنسيق النص، إدراج وتنسيق صورة، إنشاء القوائم، والمشروع.\n• الوحدة الثالثة «عالمي المتصل»: الأمان عبر الإنترنت، البحث عن المعلومات، أخلاقيات الإنترنت، العثور على المعلومات، والبحث في موسوعة ويكيبيديا."}}}, "g2s1": {"1.1": {"t": "أجزاء جهاز الحاسوب", "f": {"terms": "• جهاز الحاسوب وأجزاؤه الأساسية.\n• الأجهزة الملحقة بجهاز الحاسوب.\n• الأجزاء الأساسية: الشاشة، وحدة النظام، لوحة المفاتيح، الفأرة.\n• الأجهزة الملحقة: مكبرات الصوت، كاميرا الويب، الميكروفون، الطابعة، الكاميرا الرقمية، سماعات الأذن، الماسح الضوئي، نظارات الواقع الافتراضي، القرص الصلب الخارجي.\n• مكونات وحدة النظام: المعالج، رقاقات الذاكرة، اللوحة الأم، محرك القرص الصلب، محرك أقراص DVD، صندوق الحاسوب.", "intro": "• الكتاب لا يذكر تهيئة مستقلة بصيغة صريحة؛ ويُستنتج من محتوى الدرس بدء التعلم بالتعرف إلى جهاز الحاسوب والأجهزة الظاهرة حوله.\n• مناقشة الصور المعروضة للأجهزة وربط أسماء الأجهزة بوظائفها.\n• سؤال/مهمة: تحديد الجهاز الذي نحتاج إليه لإدخال صورة، والاستماع إلى مقطع صوتي، وطباعة صفحة.", "procedures": "1. التعرف إلى عنوان الدرس ومجاله: الحاسوب والأجهزة الملحقة به.\n2. عرض الأجهزة الأساسية والأجهزة الملحقة وتمييز كل مجموعة.\n3. التعرف إلى وظائف الأجهزة من خلال الصور والمهام المرتبطة بها.\n4. التعرف إلى ما يوجد داخل وحدة النظام: المعالج، رقاقات الذاكرة، اللوحة الأم، القرص الصلب، محرك DVD وصندوق الحاسوب.\n5. تطبيق النشاطين: تحديد الجهاز المناسب لكل استخدام، ثم تحديد الجهاز الذي تحتاجه كل مهمة.\n6. التعرف إلى الحاسوب المكتبي متعدد الإمكانات الذي يجمع الشاشة ووحدة النظام وبعض الأجهزة في جهاز واحد.", "formative": "• تحديد الأجهزة التي تناسب مهام: إدخال صورة إلى الحاسوب، لعب لعبة، تخزين صورة أو فيديو، الاستماع إلى مقطع صوتي، وطباعة صفحة.\n• تمييز الأجزاء الأساسية عن الأجهزة الملحقة.\n• تسمية المكونات الظاهرة في الصور.", "closing": "• مراجعة مخرجات التعلم في نهاية الوحدة الأولى: تمييز الأجزاء الأساسية والأجهزة الملحقة، تسمية الأجزاء الأساسية لوحدة النظام، وتحديد مكونات شريط المهام وخلفية سطح المكتب.", "homework": "• سيتعلم الطالب التمييز بين الأجزاء الأساسية لجهاز الحاسوب والأجهزة الملحقة به، والتعرف إلى بعض مكونات وحدة النظام. يُوصى بمراجعة أسماء الأجهزة ووظائفها."}}, "1.2": {"t": "سطح المكتب", "f": {"terms": "• سطح المكتب.\n• شريط المهام.\n• بدء التشغيل Start.\n• اللغة Language.\n• الوقت والتاريخ Time, Date.\n• استكشاف الملفات File Explorer.\n• التحكم في مستوى الصوت Volume Control.\n• اتصال الإنترنت Internet Connection.\n• خلفية سطح المكتب.\n• نسق سطح المكتب.\n• الوضعية الصحيحة للجلوس عند استخدام الحاسوب.", "intro": "• التهيئة غير مذكورة صراحة في الكتاب؛ ويُستنتج من عرض صورة سطح المكتب الخاص والتعرف إلى عناصره.\n• ملاحظة عناصر سطح المكتب في الصورة: Start، شريط المهام، اللغة، الوقت والتاريخ، استكشاف الملفات، التحكم في الصوت واتصال الإنترنت.\n• سؤال من محتوى الدرس: هل يمكن تغيير خلفية سطح المكتب؟ وهل يمكن تغيير نسق سطح المكتب؟", "procedures": "1. التعرف إلى مكونات شريط المهام ووظيفة كل عنصر.\n2. تغيير خلفية سطح المكتب باتباع الخطوات المصورة: النقر بزر الفأرة الأيمن، اختيار التخصيص، اختيار الخلفية، ثم اختيار الصورة المناسبة.\n3. إضافة رسمة من تصميم الطالب باستخدام Paint ووضعها كخلفية لسطح المكتب.\n4. اختيار نسق سطح المكتب الخاص وتغيير الخلفية والنسق، مع تجربة الإصدار الخفيف Windows Light.\n5. تجربة استخدام أيقونات شريط المهام.\n6. التعرف إلى وضعية الجلوس الصحيحة: الرأس مستقيم، الشاشة في مستوى النظر، الظهر مستقيم، والقدمان مستندتان على الأرض.", "formative": "• تحديد مكونات شريط المهام من الصورة.\n• ترتيب خطوات تغيير خلفية سطح المكتب.\n• تحديد ما إذا كان يمكن تغيير الخلفية والنسق.\n• التأكد من تطبيق خطوات تغيير الخلفية والنسق عمليًا.\n• مراجعة وضعية الجلوس الصحيحة والتحذيرات المصورة.", "closing": "• مراجعة مخرجات الوحدة: تمييز الأجزاء الأساسية والأجهزة الملحقة، تسمية الأجزاء الأساسية لوحدة النظام، تحديد مكونات شريط المهام، تغيير خلفية سطح المكتب، وتغيير نسق سطح المكتب.", "homework": "• سيتعلم الطالب التعرف إلى عناصر سطح المكتب، وتغيير الخلفية والنسق، والمحافظة على وضعية جلوس صحيحة أثناء استخدام الحاسوب. يُوصى بمراجعة خطوات تغيير الخلفية والنسق."}}, "2.1": {"t": "مقدمة إلى الرسم ثلاثي الأبعاد", "f": {"terms": "• الأشكال ثنائية الأبعاد (2D).\n• الأشكال ثلاثية الأبعاد (3D).\n• الطول والعرض والارتفاع.\n• الأشكال الهندسية ثلاثية الأبعاد.\n• تطبيق Tinkercad.\n• مكتبة الأشكال ثلاثية الأبعاد وأدوات التحرير وأداة العرض.", "intro": "• التهيئة غير مذكورة صراحة؛ ويُستنتج من مقارنة الأشكال ثنائية الأبعاد (مثل المثلث والدائرة والمربع) بالأشكال ثلاثية الأبعاد (مثل المخروط والمجسم الكروي والمكعب).\n• مناقشة الأشكال المحيطة بالطالب وتصنيفها إلى ثنائية وثلاثية الأبعاد.", "procedures": "1. التعرف إلى الفرق بين الشكل ثنائي الأبعاد والشكل ثلاثي الأبعاد من حيث الأبعاد.\n2. التعرف إلى أمثلة للأشكال ثنائية الأبعاد وثلاثية الأبعاد.\n3. فتح متصفح Google Chrome وكتابة عنوان موقع Tinkercad.\n4. تسجيل الدخول إلى تطبيق Tinkercad والانضمام إلى الصف وفق الخطوات المصورة.\n5. إنشاء تصميم ثلاثي الأبعاد جديد والتعرف إلى مساحة الرسم والأدوات.\n6. التعرف إلى مكتبة الأشكال ثلاثية الأبعاد وأدوات التحرير وأداة العرض.\n7. تحديد الأشكال ثلاثية الأبعاد في الصور وتصنيفها في الفئة الصحيحة.", "formative": "• تحديد الأشكال ثلاثية الأبعاد في الصور.\n• تصنيف الصور في فئتي الأشكال ثنائية الأبعاد وثلاثية الأبعاد.\n• تتبع خطوات فتح Tinkercad وتسجيل الدخول وإنشاء التصميم.", "closing": "• تطبيق نشاط تصنيف الأشكال إلى ثنائية وثلاثية الأبعاد، مع استخدام Tinkercad للتعرف إلى بيئة الرسم.", "homework": "• سيتعرف الطالب إلى الفرق بين الأشكال ثنائية وثلاثية الأبعاد، ويبدأ باستخدام Tinkercad. يُوصى بمراجعة خصائص الشكلين والتدرب على التعرف إليهما."}}, "2.2": {"t": "التعامل مع شكل ثلاثي الأبعاد", "f": {"terms": "• إضافة شكل ثلاثي الأبعاد.\n• الشكل المكعب Cube.\n• أدوات الألوان.\n• التراجع Undo.\n• تدوير الشكل ثلاثي الأبعاد.\n• تغيير حجم الشكل: الطول والعرض والارتفاع.\n• تغيير لون الشكل.\n• حذف الشكل ثلاثي الأبعاد.\n• التحريك داخل مساحة التصميم.", "intro": "• التهيئة غير مذكورة صراحة؛ ويُستنتج من بدء الدرس بفتح Tinkercad والتعامل مع شكل ثلاثي الأبعاد.\n• استرجاع مفهوم الشكل ثلاثي الأبعاد من الدرس السابق قبل إضافة الشكل وتحريره.", "procedures": "1. فتح متصفح Google Chrome والدخول إلى Tinkercad ثم تسجيل الدخول.\n2. إنشاء تصميم ثلاثي الأبعاد جديد.\n3. إضافة شكل ثلاثي الأبعاد من مكتبة الأشكال، واختيار المكعب.\n4. استخدام أدوات الألوان لإخفاء/إظهار خيارات اللون وتغيير لون الشكل.\n5. استخدام أداة التراجع Undo لإصلاح الأخطاء.\n6. تدوير الشكل ثلاثي الأبعاد إلى اليمين أو اليسار أو الأمام أو الخلف.\n7. تغيير أبعاد الشكل من خلال الطول والعرض والارتفاع.\n8. إضافة شكل ثلاثي الأبعاد آخر، وتغيير لونه وتدريبه على التحريك.\n9. حذف الشكل ثلاثي الأبعاد باستخدام أداة الحذف.", "formative": "• اختيار المقبض الصحيح لتدوير الشكل.\n• ترقيم خطوات إضافة شكل ثلاثي الأبعاد وتغيير لونه.\n• مطابقة الشكل ثلاثي الأبعاد وأداة الشكل واللون الصحيحين.\n• تحديد الأدوات المستخدمة لرسم الأشكال والأدوات التي لم تُستخدم.\n• متابعة الأداء العملي أثناء الإضافة والتدوير وتغيير الحجم واللون والحذف.", "closing": "• تنفيذ سلسلة عمليات على شكل ثلاثي الأبعاد: الإضافة، التدوير، تغيير الحجم واللون، ثم الحذف عند الحاجة.", "homework": "• سيتدرب الطالب على التعامل مع الأشكال ثلاثية الأبعاد في Tinkercad من خلال الإضافة والتدوير وتغيير الحجم واللون والحذف."}}, "2.3": {"t": "لنتدرب على التعامل مع شكل ثلاثي الأبعاد", "f": {"terms": "• التعامل العملي مع الشكل ثلاثي الأبعاد.\n• مقبض التدوير.\n• إضافة شكل ثلاثي الأبعاد وتغيير لونه.\n• أداة الشكل ثلاثي الأبعاد.\n• مطابقة الأشكال والألوان.\n• تحديد الأدوات المستخدمة في التصميم.", "intro": "• التهيئة غير مذكورة صراحة؛ ويُستنتج من كون الدرس تدريبًا عمليًا على المهارات التي سبق تعلمها في التعامل مع الشكل ثلاثي الأبعاد.", "procedures": "1. تحديد مقبض التدوير الصحيح للأشكال المعروضة.\n2. ترقيم خطوات إضافة شكل ثلاثي الأبعاد وتغيير لونه من 1 إلى 3.\n3. مطابقة الشكل ثلاثي الأبعاد وأداة الشكل واللون الصحيحين.\n4. تحديد الأدوات المستخدمة لرسم الأشكال ووضع علامة أمام الأدوات المستخدمة وغير المستخدمة.\n5. تنفيذ التدريب العملي على مهارات التدوير والإضافة وتغيير اللون.", "formative": "• اختيار مقبض التدوير الصحيح.\n• ترتيب خطوات تنفيذ المهمة.\n• مطابقة الشكل والأداة واللون.\n• تحديد الأدوات المستخدمة في التصميم.", "closing": "• إتمام تدريبات الدرس الأربع للتحقق من القدرة على التعامل مع الشكل ثلاثي الأبعاد وفق الخطوات الصحيحة.", "homework": "• سيتدرب الطالب على مهارات التدوير والإضافة وتغيير اللون في الأشكال ثلاثية الأبعاد، مع ترتيب الخطوات ومطابقة الأدوات المناسبة."}}, "2.4": {"t": "إنشاء نموذج ثلاثي الأبعاد", "f": {"terms": "• النموذج ثلاثي الأبعاد.\n• إنشاء نموذج باستخدام أكثر من شكل ثلاثي الأبعاد.\n• المخروط Cone.\n• الكرة Sphere.\n• تغيير الحجم واللون.\n• تكرار الشكل.\n• أداة العرض View Controls.\n• مكعب العرض ViewCube.\n• مناظير العرض: الأمامي FRONT، اليمين RIGHT، الخلف BACK.", "intro": "• التهيئة غير مذكورة صراحة؛ ويُستنتج من فكرة إنشاء نموذج مكوّن من أكثر من شكل ثلاثي الأبعاد.\n• ربط الدرس بمهارات إضافة الشكل وتغيير لونه وحجمه وتدويره التي تم التدريب عليها سابقًا.", "procedures": "1. إنشاء نموذج لمخروط المثلجات بإضافة مخروط ثلاثي الأبعاد وتغيير لونه.\n2. إضافة كرة ثلاثية الأبعاد ووضعها فوق الجزء العلوي من المخروط.\n3. تحديد الكرة وتغيير موقعها وأبعادها بما يناسب النموذج.\n4. تغيير لون الشكل وتكراره لإضافة كرات أخرى إلى نموذج المثلجات.\n5. إنشاء قلم رصاص ثلاثي الأبعاد، وإنشاء كرة المثلجات الثالثة وفق الخطوات المصورة.\n6. استعراض التصميم من مناظير مختلفة باستخدام أدوات التحكم في العرض.\n7. استخدام مكعب العرض ViewCube للانتقال إلى المنظر الأمامي والأيمن والخلفي.\n8. التدرب على النظر إلى التصميم من جميع المناظير.", "formative": "• متابعة ترتيب خطوات إنشاء مخروط المثلجات.\n• التحقق من وضع الكرة في الجزء العلوي من المخروط.\n• ملاحظة القدرة على تغيير الحجم واللون وتكرار الشكل.\n• تحديد طريقة الانتقال بين مناظير العرض المختلفة.", "closing": "• إنشاء نموذج ثلاثي الأبعاد باستخدام أكثر من شكل، ثم استعراضه من المناظر الأمامي والأيمن والخلفي.", "homework": "• سيتعلم الطالب إنشاء نموذج ثلاثي الأبعاد من عدة أشكال، وتغيير ألوانها وأحجامها ومواقعها، ثم استعراض التصميم من مناظير مختلفة."}}, "2.5": {"t": "لنتدرب على النماذج ثلاثية الأبعاد", "f": {"terms": "• أدوات بيئة التصميم.\n• طرق عرض النموذج ثلاثي الأبعاد.\n• العرض الافتراضي Home.\n• المنظر العلوي والسفلي والأمامي والأيمن والأيسر والخلفي.\n• تكرار النموذج.", "intro": "• التهيئة غير مذكورة صراحة؛ ويُستنتج من الانتقال إلى التدريب على الأدوات وطرق العرض التي تم تعلمها في الدروس السابقة.", "procedures": "1. التعرف إلى مواضع الأدوات في بيئة التصميم من خلال نشاط لصق الأدوات في مكانها المناسب.\n2. استكشاف طرق العرض المختلفة وملاحظة الفرق بين العرض الافتراضي Home والمناظير الأخرى.\n3. كتابة طريقة عرض كل صورة من الصور المعروضة.\n4. ترقيم خطوات تكرار النموذج من 1 إلى 3.\n5. تنفيذ التدريب العملي على استخدام طرق العرض وتكرار النموذج.", "formative": "• تحديد مكان كل أداة في بيئة التصميم.\n• مقارنة طرق العرض المختلفة.\n• كتابة طريقة العرض المناسبة لكل صورة.\n• ترتيب خطوات تكرار النموذج.", "closing": "• إكمال أنشطة تحديد الأدوات وطرق العرض وترتيب خطوات تكرار النموذج.", "homework": "• سيتدرب الطالب على تحديد أدوات بيئة التصميم، واستخدام طرق العرض المختلفة، وتكرار النماذج ثلاثية الأبعاد."}}, "2.6": {"t": "استكشاف النص ثلاثي الأبعاد", "f": {"terms": "• النص ثلاثي الأبعاد (3D Text).\n• فتح المشروع.\n• إعادة تسمية المشروع.\n• إضافة نص ثلاثي الأبعاد.\n• تغيير لون النص.\n• تغيير اتجاه وموقع النص.\n• تحديد النص أو الشكل وإلغاء التحديد.\n• تصدير التصميم.\n• فتح التصميم وتعديله وحفظ العمل.", "intro": "• التهيئة غير مذكورة صراحة؛ ويُستنتج من الانتقال من النماذج ثلاثية الأبعاد إلى إضافة نص ثلاثي الأبعاد إلى نموذج قائم.\n• استدعاء مهارات التعامل مع الأشكال من الدروس السابقة قبل إضافة النص وتحريره.", "procedures": "1. فتح مشروع المثلجات الذي تم إنشاؤه.\n2. إعادة تسمية المشروع.\n3. إضافة شكل نص ثلاثي الأبعاد إلى التصميم وكتابة النص.\n4. تغيير لون النص ثلاثي الأبعاد.\n5. تغيير اتجاه وموقع النص داخل التصميم.\n6. تصدير التصميم ثلاثي الأبعاد.\n7. فتح التصميم المُصدّر.\n8. إضافة نصوص أخرى للمشروع وتعديل التصميم.\n9. حفظ العمل باستمرار.", "formative": "• متابعة خطوات فتح المشروع وإعادة تسميته.\n• التأكد من إضافة النص ثلاثي الأبعاد وكتابة النص المطلوب.\n• التحقق من تغيير اللون والاتجاه والموقع.\n• متابعة تنفيذ التصدير وفتح التصميم وإضافة نصوص أخرى.", "closing": "• إتمام تصميم ثلاثي الأبعاد يتضمن نصًا، وتغيير خصائصه، ثم تصدير التصميم وفتحه وتعديله وحفظه.", "homework": "• سيتعلم الطالب إضافة نص ثلاثي الأبعاد إلى تصميمه وتغيير لونه وموقعه واتجاهه، ثم تصدير التصميم وفتحه وتعديله وحفظه."}}, "3.1": {"t": "مقدمة إلى معالجة الكلمات", "f": {"terms": "• تطبيقات معالجة الكلمات.\n• Microsoft Word.\n• مفاتيح الكتابة: الحروف والأرقام.\n• مفاتيح الأسهم.\n• مفتاح Shift.\n• مفتاح Backspace.\n• مفتاح Spacebar.\n• مفتاح Enter.\n• مفاتيح لوحة المفاتيح.", "intro": "• التهيئة غير مذكورة صراحة؛ ويُستنتج من صور استخدام تطبيقات معالجة الكلمات في المدرسة والعمل والحياة اليومية.\n• مناقشة استخدامات تطبيقات معالجة الكلمات في الحياة اليومية.", "procedures": "1. التعرف إلى استخدامات تطبيقات معالجة الكلمات في الحياة اليومية وفي المدرسة والعمل.\n2. التعرف إلى لوحة المفاتيح ومفاتيح الكتابة للحروف والأرقام.\n3. التعرف إلى مفاتيح الأسهم ومفتاح Shift ومفتاح Backspace ومفتاح Spacebar ومفتاح Enter.\n4. تطبيق نشاط لصق صور المفاتيح المفقودة في لوحة المفاتيح.\n5. التهيؤ للانتقال إلى الكتابة في تطبيق Microsoft Word.", "formative": "• ذكر استخدامات أخرى لتطبيقات معالجة الكلمات.\n• تحديد أسماء المفاتيح ووظائفها من لوحة المفاتيح.\n• إكمال صور المفاتيح المفقودة.", "closing": "• إكمال نشاط التعرف إلى مفاتيح لوحة المفاتيح ومراجعة استخدامات تطبيقات معالجة الكلمات.", "homework": "• سيتعرف الطالب إلى تطبيقات معالجة الكلمات ومفاتيح لوحة المفاتيح الأساسية ووظائفها، تمهيدًا للكتابة باستخدام Microsoft Word."}}, "3.2": {"t": "كتابة نص", "f": {"terms": "• تطبيق Microsoft Word.\n• منطقة الكتابة.\n• المؤشر Cursor.\n• شريط الأدوات.\n• لغة الكتابة.\n• اتجاه النص.\n• مفتاح Spacebar.\n• مفتاح Enter.\n• مفتاح Backspace.\n• حفظ المستند.", "intro": "• التهيئة غير مذكورة صراحة؛ ويُستنتج من الانتقال من التعرف إلى لوحة المفاتيح إلى فتح Word والبدء في كتابة نص.\n• استرجاع وظائف مفاتيح الكتابة الأساسية التي تمت دراستها في الدرس السابق.", "procedures": "1. فتح تطبيق Microsoft Word والتعرف إلى منطقة الكتابة والمؤشر وشريط الأدوات.\n2. تغيير لغة الكتابة إلى العربية.\n3. كتابة كلمة «وطني».\n4. تغيير اتجاه النص إلى اليمين.\n5. استخدام مفتاح Spacebar وكتابة «عمان».\n6. استخدام مفتاح Enter لإنشاء سطر جديد وكتابة «وطن السلام».\n7. استخدام Backspace عند الحاجة لتصحيح النص.\n8. كتابة نص يتضمن «محافظة مسندم» و«محافظة ظفار».\n9. حفظ العمل.", "formative": "• متابعة تحديد منطقة الكتابة والمؤشر.\n• التأكد من تغيير لغة الكتابة إلى العربية.\n• ملاحظة اتجاه النص الصحيح.\n• التدرب على Spacebar وEnter وBackspace.\n• ترتيب خطوات حفظ العمل.", "closing": "• كتابة النص المطلوب في Word ثم حفظه باستخدام خطوات الحفظ المصورة.", "homework": "• سيتعلم الطالب فتح Microsoft Word وكتابة نص عربي، وتغيير اتجاهه واستخدام مفاتيح المسافة والإدخال والحذف، ثم حفظ العمل."}}, "3.3": {"t": "لنتدرب على الكتابة", "f": {"terms": "• التدرب على الكتابة في Word.\n• تغيير اتجاه النص.\n• مفاتيح لوحة المفاتيح المستخدمة في الكتابة.\n• حفظ العمل.", "intro": "• التهيئة غير مذكورة صراحة؛ ويُستنتج من كون الدرس تدريبًا على مهارات الكتابة التي تم تعلمها في الدرس السابق.", "procedures": "1. مطابقة الصور بنتائج الكتابة.\n2. تحديد الأداة التي يجب النقر عليها لتغيير اتجاه النص.\n3. تحديد المفاتيح المستخدمة لكتابة النص المعروض.\n4. ترقيم خطوات حفظ العمل من 1 إلى 4.\n5. تطبيق تدريبات الكتابة والحفظ.", "formative": "• مطابقة صور خطوات الكتابة بنتائجها.\n• تحديد أداة تغيير اتجاه النص.\n• تحديد المفاتيح المستخدمة في كتابة النص.\n• ترتيب خطوات الحفظ.", "closing": "• إنجاز التدريبات الأربعة للتحقق من إتقان الكتابة وتغيير الاتجاه وحفظ العمل.", "homework": "• سيتدرب الطالب على الكتابة في Word، وتغيير اتجاه النص، والتعرف إلى المفاتيح المستخدمة، وترتيب خطوات حفظ العمل."}}, "3.4": {"t": "التحرك داخل النص", "f": {"terms": "• التحرك داخل النص.\n• مفتاح Shift.\n• مفاتيح الأسهم.\n• مفتاح Delete.\n• المؤشر.\n• علامات الترقيم.", "intro": "• التهيئة غير مذكورة صراحة؛ ويُستنتج من النص الموجود في المستند ومن الحاجة إلى تحريك المؤشر وتعديل الكلمات والعلامات.", "procedures": "1. فتح مستند نصي.\n2. تحريك المؤشر داخل النص.\n3. استخدام Shift مع المفتاح المناسب لكتابة حرف الألف بهمزة أعلى.\n4. حذف كلمة «رقمي» وكتابة كلمة «أمين».\n5. تحريك المؤشر باستخدام مفاتيح الأسهم وكتابة «التسامح و».\n6. استخدام مفتاح Delete لمسح النص من الموضع المحدد.\n7. كتابة نقطة باستخدام Shift مع المفتاح المناسب.\n8. إكمال علامات الترقيم في النص وتحريك المؤشر إلى المواضع المناسبة.", "formative": "• تطبيق حركة المؤشر باستخدام مفاتيح الأسهم.\n• تحديد استخدام Shift لكتابة الهمزة وعلامة الترقيم.\n• تنفيذ الحذف باستخدام Delete.\n• إكمال علامات الترقيم في النص.", "closing": "• إكمال النص بإضافة علامات الترقيم وتحريك المؤشر واستخدام مفاتيح Shift وDelete وفق المطلوب.", "homework": "• سيتعلم الطالب التحرك داخل النص باستخدام المؤشر ومفاتيح الأسهم، واستخدام Shift وDelete وإكمال علامات الترقيم."}}, "3.5": {"t": "لنتدرب على تحريك المؤشر", "f": {"terms": "• تحريك المؤشر.\n• مفاتيح الأسهم.\n• مفاتيح لوحة المفاتيح الخاصة بالرموز والحروف.\n• مفتاح Shift.", "intro": "• التهيئة غير مذكورة صراحة؛ ويُستنتج من ارتباط الدرس مباشرة بمهارة التحرك داخل النص.", "procedures": "1. لصق صور المفاتيح المفقودة.\n2. مطابقة المفتاح بحركة المؤشر.\n3. تمييز مفاتيح الرموز والحروف التي تكتب بواسطة Shift.\n4. اختيار المفاتيح المناسبة للرموز والحروف المعروضة.", "formative": "• لصق المفاتيح المفقودة في أماكنها.\n• مطابقة المفاتيح بحركة المؤشر.\n• تمييز المفاتيح التي تستخدم مع Shift.\n• اختيار المفتاح الصحيح لكل رمز أو حرف.", "closing": "• إتمام تدريبات تحريك المؤشر وتمييز مفاتيح الرموز والحروف.", "homework": "• سيتدرب الطالب على تحريك المؤشر بالمفاتيح المناسبة، وتمييز المفاتيح المستخدمة لكتابة الرموز والحروف مع Shift."}}, "3.6": {"t": "تنسيق النص", "f": {"terms": "• تحديد النص.\n• تغيير حجم النص.\n• تغيير لون الخط.\n• تغيير نوع الخط.\n• تأثيرات النص.\n• تنسيق النص.", "intro": "• التهيئة غير مذكورة صراحة؛ ويُستنتج من الانتقال من الكتابة وتحديد الكلمات إلى تعديل مظهر النص.", "procedures": "1. تحديد الكلمات باستخدام الفأرة، والتعرف إلى إمكانية استخدام لوحة المفاتيح للتحديد.\n2. تغيير حجم النص المحدد.\n3. تغيير لون الخط.\n4. تغيير نوع الخط.\n5. تطبيق تغييرات التنسيق على النص.\n6. إضافة تأثيرات على النص من خلال أدوات Word.\n7. تطبيق تأثيرات مختلفة على النص وملاحظة النتيجة.", "formative": "• تحديد النص بالفأرة.\n• اختيار أداة تغيير الحجم وتطبيقها.\n• اختيار لون الخط المناسب.\n• اختيار نوع الخط.\n• مطابقة تأثير النص مع النتيجة المناسبة.\n• تطبيق التأثيرات عمليًا.", "closing": "• تنسيق النص المعروض بتغيير الحجم واللون ونوع الخط وإضافة تأثيرات عليه.", "homework": "• سيتعلم الطالب تحديد النص وتنسيقه من خلال تغيير الحجم واللون ونوع الخط وإضافة التأثيرات."}}, "3.7": {"t": "لنتدرب على تنسيق النص", "f": {"terms": "• تطبيق تنسيق النص.\n• تغيير لون النص.\n• تأثيرات النص.\n• ترتيب خطوات التنسيق.", "intro": "• التهيئة غير مذكورة صراحة؛ ويُستنتج من كون الدرس تدريبًا مباشرًا على مهارات تنسيق النص السابقة.", "procedures": "1. ترقيم خطوات تغيير اللون من 1 إلى 3.\n2. تطبيق تأثير النص على العبارة المعروضة.\n3. مطابقة التأثير بالنتيجة المناسبة.\n4. مطابقة إجراءات التنسيق بالنتيجة النهائية.\n5. ترقيم خطوات تغيير تأثير النص من 1 إلى 3.", "formative": "• ترتيب خطوات تغيير اللون.\n• مطابقة تأثير النص بالنتيجة.\n• مطابقة الإجراء بالنتيجة المناسبة.\n• ترتيب خطوات تغيير التأثير.", "closing": "• إتمام التدريبات الخاصة بتغيير اللون والتأثيرات وترتيب خطوات تنفيذها.", "homework": "• سيتدرب الطالب على تنسيق النص من خلال تغيير اللون والتأثيرات وترتيب خطوات تنفيذ التنسيق."}}, "3.8": {"t": "أساسيات تحرير النص", "f": {"terms": "• تحديد كلمة أو جزء من النص.\n• نسخ النص.\n• لصق النص.\n• حذف جزء من النص.\n• تحرير النص.\n• مفتاح Delete.\n• أدوات النسخ واللصق.\n• حفظ المستند.", "intro": "• التهيئة غير مذكورة صراحة؛ ويُستنتج من الانتقال من تنسيق النص إلى إجراء عمليات تحرير عليه.", "procedures": "1. تحديد كلمة في النص.\n2. نسخ النص ولصقه ثم كتابة كلمة «عمان».\n3. نسخ جملة معروضة وإجراء التعديل المطلوب عليها.\n4. حذف جزء من النص باستخدام Delete.\n5. تطبيق عمليات النسخ واللصق والحذف على نصوص مرتبطة بموضوع عمان والوطن.\n6. تنفيذ نشاط تعديل النص إلى صورة منسقة باستخدام اللون والتنسيق المناسب.\n7. مراجعة مخرجات الوحدة المتعلقة بالكتابة وتغيير اللغة والاتجاه والحفظ وعلامات الترقيم والتنسيق والنسخ واللصق والحذف.", "formative": "• تحديد الكلمة أو الجزء المطلوب.\n• تنفيذ النسخ واللصق.\n• حذف جزء من النص باستخدام Delete.\n• مقارنة النص قبل التحرير وبعده.\n• تطبيق عمليات التحرير على الجملة المعروضة.", "closing": "• تنفيذ تدريبات النسخ واللصق والحذف وتع   ['2.2','رسم الأشكال',60,78,['فتح تطبيق الرسام.','التعرف إلى الأدوات الرئيسة في تطبيق الرسام.','رسم الأشكال وتحريرها.','استخدام أدوات المسح والتراجع والإعادة لتصحيح أخطاء الرسم.','حفظ رسمة رقمية.']],

  ['2.4','دمج الأشكال',70,90,['دمج الأشكال لإنشاء رسمة جديدة.','رسم خط وتغيير حجمه ولونه.','تلوين الخلفية.']],
  ['2.5','لنتدرب على دمج الأشكال',74,94,['التدرب على دمج الأشكال.','التمييز بين أشكال الرسم وأدواتها.']],
  ['2.6','الرسم الحر',77,100,['إنشاء رسمة باستخدام الفرشاة (Brush).','فتح ملف رسم رقمي سابق والتعديل عليه.']]]},
 {n:3,title:'لنتصفح',lessons:[
  ['3.1','الإنترنت',86,107,['التعرف إلى الإنترنت وطرق الاتصال به.','التعرف إلى استخدامات الإنترنت.','اتباع قواعد الأمان والسلامة في أثناء تصفح الإنترنت.']],
  ['3.2','استمتع',94,114,['استخدام متصفح الإنترنت لزيارة موقع ويب.']],
  ['3.3','تواصل',98,120,['التعرف إلى طرق التواصل مع الآخرين عبر الإنترنت.','اتباع قواعد التواصل الآمن.']],
  ['3.4','ابحث',103,126,['البحث عن مواقع ويب ومعلومات باستخدام محرك البحث Google.']],
  ['3.5','المشروع',103,126,['توظيف مهارات التصفح والبحث والتواصل في إنجاز مشروع.']]]}]},
g1s2:{grade:1,sem:2,units:[
 {n:1,title:'لنفكر',lessons:[
  ['1.1','اتباع التعليمات',16,23,['وصف المهام البسيطة.','اتباع خطوات متسلسلة لأداء مهمة.','تقسيم مهمة إلى خطوات صغيرة.']],
  ['1.2','تنفيذ مهمة بسيطة',24,30,['التعرف إلى الأوامر الأساسية لتطبيق Digital Kids Go!','إعطاء تعليمات لتحريك كائن السيارة في اتجاهات مختلفة.']],
  ['1.3','استكشاف الأخطاء',32,34,['استكشاف الأخطاء وتصحيحها.']],
  ['1.4','تنفيذ مهمة معقدة',38,39,['إعطاء تعليمات لكائن السيارة للدوران في اتجاهات مختلفة.','تقسيم المهام المعقدة إلى مهام أصغر.']]]},
 {n:2,title:'هيا نبرمج',lessons:[
  ['2.1','اتباع القواعد',50,47,['اتباع قواعد إعطاء التعليمات للحاسوب.']],
  ['2.2','البرمجة في تطبيق ScratchJr',56,54,['التعرف إلى أساسيات بيئة تطبيق ScratchJr.','إنشاء برنامج لتحريك كائن.']],
  ['2.3','لنتدرب على تطبيق ScratchJr',68,59,['التدرب على أساسيات تطبيق ScratchJr.','التدرب على استخدام لبنات الحركة.']],
  ['2.4','التعامل مع الخلفية',72,66,['تغيير الخلفية في تطبيق ScratchJr.','جعل الكائن يقفز.']],
  ['2.5','لنتدرب على التعامل مع الخلفية',76,70,['ذكر سبب تغيير الخلفية في تطبيق ScratchJr.','ذكر وظيفة لبنة القفز.']],
  ['2.6','تدوير الكائن',80,77,['استخدام لبنات التدوير لتدوير الكائن.']],
  ['2.7','لنتدرب على التدوير',84,81,['التدرب على تدوير الكائنات.']],
  ['2.8','التحكم بالسرعة',88,88,['إضافة كائن جديد.','التحكم بسرعة الكائنات.']],
  ['2.9','لنتدرب على التحكم بالسرعة',94,91,['معرفة كيفية إضافة كائن جديد.','معرفة استخدام لبنة التحكم بالسرعة.']],
  ['2.10','المشروع',97,97,['توظيف مهارات البرمجة في ScratchJr لإنشاء مشروع.']]]}]},
g2s1:{grade:2,sem:1,units:[
 {n:1,title:'حاسوبي',lessons:[
  ['1.1','أجزاء جهاز الحاسوب',16,23,['تمييز الأجزاء الأساسية لجهاز الحاسوب.','تمييز الأجزاء الملحقة بجهاز الحاسوب.','تسمية الأجزاء الأساسية لوحدة نظام الحاسوب.','التعرف إلى الحاسوب متعدد الإمكانات.']],
  ['1.2','سطح المكتب',22,30,['التعرف إلى مكونات شريط المهام.','تغيير خلفية سطح المكتب.','تغيير نسق سطح المكتب.','اتباع القواعد الصحية في أثناء التعامل مع الحاسوب.']]]},
 {n:2,title:'هيا نصمم',lessons:[
  ['2.1','مقدمة إلى الرسم ثلاثي الأبعاد',32,38,['التمييز بين الأشكال ثنائية الأبعاد والأشكال ثلاثية الأبعاد.','التعرف إلى واجهة تطبيق تنكركاد (Tinkercad).']],
  ['2.2','التعامل مع كائن ثلاثي الأبعاد',37,44,['فتح تطبيق تنكركاد (Tinkercad).','إضافة شكل ثلاثي الأبعاد.','تدوير شكل ثلاثي الأبعاد.','تغيير حجم شكل ثلاثي الأبعاد ولونه.','حذف شكل ثلاثي الأبعاد.']],
  ['2.3','لنتدرب على التعامل مع شكل ثلاثي الأبعاد',47,49,['التدرب على مهارة تدوير الأشكال ثلاثية الأبعاد.','ترتيب خطوات إضافة الأشكال ثلاثية الأبعاد.','تمييز أدوات تطبيق تنكركاد.']],
  ['2.4','إنشاء نموذج ثلاثي الأبعاد',51,56,['استخدام أدوات التحكم بطرق العرض لعرض شكل ثلاثي الأبعاد.','تحريك شكل ثلاثي الأبعاد رأسيًا وأفقيًا.','تكرار شكل ثلاثي الأبعاد.']],
  ['2.5','لنتدرب على النماذج ثلاثية الأبعاد',60,62,['تحديد الأدوات المستخدمة لإنشاء شكل ثلاثي الأبعاد.','مطابقة طرق العرض مع المناظير الصحيحة للنموذج.','ترتيب خطوات مضاعفة نموذج ثلاثي الأبعاد.']],
  ['2.6','استكشاف المكتبة ثلاثية الأبعاد',64,70,['فتح مشروع تصميم ثلاثي الأبعاد وتحريره.','إعادة تسمية المشروع.','إضافة شكل نصي ثلاثي الأبعاد.','تصدير تصميم ثلاثي الأبعاد.']]]},
 {n:3,title:'هيا نكتب',lessons:[
  ['3.1','مقدمة إلى معالجة الكلمات',76,77,['التعرف إلى استخدامات تطبيقات معالجة الكلمات.','التعرف إلى مفاتيح الكتابة.']],
  ['3.2','كتابة نص',80,81,['فتح تطبيق معالج الكلمات (Microsoft Word).','تغيير لغة الكتابة واتجاه النص.','كتابة نص باستخدام معالج الكلمات.','استخدام مفتاح المسافة (Spacebar) ومفتاح الإدخال (Enter).','حفظ مستند نصي وفتحه.']],
  ['3.3','لنتدرب على الكتابة',85,86,['تمييز المفاتيح الأساسية للكتابة ووظائفها.','ذكر خطوات حفظ المستند النصي.']],
  ['3.4','التحرك داخل النص',88,93,['فتح مستند نصي.','استخدام مفتاح العالي (Shift) لكتابة بعض الحروف والرموز.','التحرك داخل النص باستخدام لوحة المفاتيح والفأرة.','استخدام مفتاح الحذف (Delete).']],
  ['3.5','لنتدرب على تحريك المؤشر',93,98,['التدرب على تحريك مؤشر الكتابة.','التدرب على استخدام مفتاح العالي (Shift) مع الأحرف والرموز.']],
  ['3.6','تنسيق النص',95,103,['تغيير حجم النص.','تغيير لون النص.','تغيير نوع الخط.','إضافة التأثيرات إلى النص.']],
  ['3.7','لنتدرب على تنسيق النص',100,108,['التدرب على تنسيق النص.']],
  ['3.8','أساسيات تحرير النص',104,115,['تحديد كلمة باستخدام الفأرة.','نسخ جزء من النص ولصقه باستخدام الفأرة.','حذف جزء من النص باستخدام مفتاح الحذف (Delete).']],
  ['3.9','المشروع',104,115,['توظيف مهارات معالجة الكلمات في إنجاز مشروع.']]]}]},
g2s2:{grade:2,sem:2,units:[
 {n:1,title:'هيا نبرمج',lessons:[
  ['1.1','كيفية البرمجة',18,23,['اتباع التعليمات لإنشاء برنامج.','التعرف إلى مفهوم البرنامج.','تعريف المقطع البرمجي.','إعطاء تعليمات واضحة ومتسلسلة.']],
  ['1.2','التحكم في الوقت',22,29,['استخدام لبنة التحدث لإنشاء محادثة.','استخدام لبنة الانتظار لإيقاف المقطع البرمجي لفترة محددة.']],
  ['1.3','حل المشكلات',26,34,['التعرف إلى مفهوم المشكلة.','اتباع خطوات دورة حل المشكلات لحل مشكلة ما.']],
  ['1.4','طرق تشغيل البرنامج',30,40,['التعامل مع لبنات التشغيل لتفعيل مقطع برمجي.','التمييز بين لبنتي التشغيل: ابدأ عند النقر، وابدأ عند الاصطدام.']],
  ['1.5','لنتدرب على طرق تشغيل البرنامج',34,45,['معرفة فئة لبنات التشغيل.','التدرب على استخدام لبنتي ابدأ عند النقر وابدأ عند الاصطدام.']],
  ['1.6','الرسوم المتحركة',37,52,['التعرف إلى مفهوم الرسوم المتحركة.','استخدام لبنات المظاهر لتغيير حجم الكائن.','إضافة عنوان المشروع وتحريره.']],
  ['1.7','لنتدرب على الرسوم المتحركة',45,57,['معرفة خطوات إنشاء عنوان.','التدرب على استخدام لبنات تكبير الكائن وتصغيره واستعادة حجمه.','اكتشاف الخطأ في المقطع البرمجي وتصحيحه.']],
  ['1.8','التعامل مع الصفحات',52,68,['إضافة صفحات في تطبيق ScratchJr.','برمجة الكائنات في صفحات مختلفة للمشروع نفسه.','التنقل بين صفحات المشروع.']],
  ['1.9','الأنماط',57,73,['التعرف إلى مفهوم النمط.','التمييز بين الأنواع المختلفة للأنماط.']],
  ['1.10','التكرار',64,80,['التعرف إلى مفهوم التكرار.','التعامل مع لبنات التكرار.']],
  ['1.11','لنتدرب على التكرار',68,85,['التدرب على استخدام لبنات التكرار.','التعامل مع الأنماط لحل المشكلات.']],
  ['1.12','التحكم في ظهور كائن',73,92,['التعامل مع لبنة الصوت.','إخفاء كائن وإظهاره.']],
  ['1.13','لنتدرب على التحكم في ظهور الكائن',78,97,['التنبؤ بناتج مقطع برمجي.','تمييز نتائج لبنات الإخفاء والإظهار.','التدرب على العمل على صفحات متعددة في المشروع.']],
  ['1.14','المشروع',82,105,['توظيف مهارات البرمجة في ScratchJr لإنشاء مشروع متكامل.']]]}]},
g3s1:{grade:3,sem:1,units:[
 {n:1,title:'حاسوبي',lessons:[
  ['1.1','أجهزة التفاعل مع الحاسوب',18,22,['التعرف إلى أجهزة التفاعل مع الحاسوب.','التعرف إلى استخدامات التقنيات المساعدة.','تحديد الأجهزة التي يمكن تخزين الملفات عليها.']],
  ['1.2','تنظيم الملفات والمجلدات',26,29,['التعرف إلى أنواع الملفات المختلفة وخصائصها.','إنشاء مجلدات ومجلدات فرعية (Subfolders) لتنظيم الملفات.','التعامل مع الملفات والمجلدات بإعادة تسميتها ونسخها ونقلها.']],
  ['1.3','أجهزة الطباعة والالتقاط',38,35,['التعرف إلى أنواع مختلفة من أجهزة الالتقاط لإدخال البيانات (الصوت والصور والفيديو).','التعرف إلى طرق توصيل أجهزة الالتقاط بالحاسوب لنقل الملفات.']]]},
 {n:2,title:'هيا نكتب',lessons:[
  ['2.1','تنسيق النص',52,44,['فتح مستند في تطبيق معالج الكلمات.','تمييز جزء من النص.','تنسيق النص بجعله غامقًا أو مائلًا أو مسطرًا.','استخدام محاذاة النص.']],
  ['2.2','إدراج وتنسيق صورة',60,50,['إدراج صورة في مستند نصي.','تغيير حجم الصورة.','قص الصورة.','إضافة حدود إلى الصورة.','تطبيق نمط الصورة.','استخدام خيار التفاف النص (Wrap Text).']],
  ['2.3','إنشاء القوائم',73,59,['استخدام القوائم لتنظيم النص في المستند.','استخدام شريط التكبير والتصغير لتكبير المستند وتصغيره.','طباعة ملف مستند.']],
  ['2.4','المشروع',80,66,['توظيف مهارات معالجة الكلمات في إنشاء مستند متكامل.']]]},
 {n:3,title:'عالمي المتصل',lessons:[
  ['3.1','الأمان عبر الإنترنت',88,72,['اتباع قواعد الأمان لحماية المعلومات الشخصية.','التعرف إلى كيفية إنشاء اسم مستعار لضمان السلامة.','التعرف إلى البرمجيات الضارة في الحاسوب.']],
  ['3.2','البحث عن المعلومات',96,79,['التعرف إلى مكونات واجهة متصفح الإنترنت.','استخدام محرك البحث (Google) للبحث عن معلومات.','فتح تبويب جديد (New Tab) وإغلاقه.']],
  ['3.3','أخلاقيات الإنترنت',104,85,['اتباع أخلاقيات الإنترنت في أثناء التواصل مع الآخرين.','مراجعة السلوكيات والقواعد المتبعة لحماية الأشخاص عند استخدامهم للإنترنت.']],
  ['3.4','العثور على المعلومات',109,91,['نسخ الصور والنصوص من موقع لإنشاء مستند.']],
  ['3.5','البحث في موسوعة ويكيبيديا',116,95,['استخدام موسوعة ويكيبيديا للبحث عن المعلومات.','حفظ الصور من موقع على جهاز الحاسوب.']]]}]},
g3s2:{grade:3,sem:2,units:[
 {n:1,title:'هيا نبرمج',lessons:[
  ['1.1','التعامل مع الخوارزميات',16,22,['تقسيم المشكلة إلى مشكلات فرعية لحلها.','التعرف إلى المقصود بالخوارزمية.']],
  ['1.2','البرمجة في Scratch',22,28,['التعرف إلى أساسيات بيئة تطبيق Scratch.','استخدام لبنة «عند نقر العلم» من فئة لبنات الأحداث (Events).','استخدام لبنة التحرك (move) لتحريك الكائن على المنصة.','ضبط اتجاه الكائن للتحرك في اتجاهات مختلفة.','حفظ المشروع على الحاسوب.']],
  ['1.3','تصحيح الأخطاء',34,34,['توظيف دورة تصحيح الأخطاء في اكتشاف الأخطاء وتصحيحها.','التعرف إلى أنواع الأخطاء الشائعة في المقاطع البرمجية في Scratch.']],
  ['1.4','الدوران',39,40,['فتح مشروع في تطبيق Scratch.','تغيير خلفية المشروع.','برمجة الكائن ليدور في اتجاهات متعددة بدرجات دوران مختلفة.','استخدام لبنات التحدث.']],
  ['1.5','لنتدرب على Scratch',48,44,['معرفة فئات اللبنات.','التدرب على استخدام لبنات التحدث والتحرك والتدوير.']],
  ['1.6','التكرارات',52,51,['إضافة كائن وحذفه.','تكرار جزء من المقطع البرمجي باستخدام لبنات التكرار.','إيقاف تنفيذ المقطع البرمجي مؤقتًا.','إضافة المؤثرات الصوتية داخل المشروع.']],
  ['1.7','لنتدرب على التكرارات',61,56,['التدرب على تحويل الخوارزمية إلى مقطع برمجي.']],
  ['1.8','الرسم في Scratch',66,64,['إضافة فئة لبنات القلم إلى لوح اللبنات.','إنشاء رسومات باستخدام لبنات القلم.','تغيير حجم خط القلم ولونه.','طباعة نسخة من الكائن على المنصة في أثناء حركته.']],
  ['1.9','لنتدرب على لبنات القلم',74,68,['التدرب على إنشاء رسومات مختلفة باستخدام لبنات القلم.']],
  ['1.10','المشروع',80,77,['توظيف مهارات البرمجة في Scratch لإنشاء مشروع.']]]},
 {n:2,title:'هيا نصمم',lessons:[
  ['2.1','الأشكال وطرق عرضها',88,83,['التعرف إلى طرق العرض المختلفة للأشكال ثنائية الأبعاد والأشكال ثلاثية الأبعاد.','التعرف إلى تطبيقات الأشكال ثنائية وثلاثية الأبعاد.','التعرف إلى الأدوات الأساسية في تطبيق تنكركاد (Tinkercad).']],
  ['2.2','تحرير الكائنات ثلاثية الأبعاد',98,92,['تكرار كائن ثلاثي الأبعاد.','تغيير حجم كائن ثلاثي الأبعاد.','إضافة كائن كسطح على مساحة العمل (Workplane).','إدراج نموذج ثلاثي الأبعاد في مستند نصي.']],
  ['2.3','لنتدرب على الكائنات ثلاثية الأبعاد',110,98,['التدرب على تحديد الأشكال ثنائية الأبعاد والأشكال ثلاثية الأبعاد بدقة.','تمثيل كائنات ثلاثية الأبعاد على سطح ثنائي الأبعاد.','التعرف إلى الأشكال ورسم مناظيرها المختلفة.','التدرب على إدراج نموذج ثلاثي الأبعاد في مستند نصي وتعديل حجمه وموضعه.']],
  ['2.4','الرسم الحر ثلاثي الأبعاد',117,107,['تحويل الرسم اليدوي الحر إلى كائن ثلاثي الأبعاد.','تجميع كائنات ثلاثية الأبعاد.']]]}]},
g4s1:{grade:4,sem:1,units:[
 {n:1,title:'حاسوبي',lessons:[
  ['1.1','كيفية عمل جهاز الحاسوب',16,23,['التعرف إلى فئات المكونات المادية لجهاز الحاسوب.','وصف كيفية عمل جهاز الحاسوب.']],
  ['1.2','أجهزة الوسائط المتعددة',24,29,['التعرف إلى الملفات المختلفة في الحاسوب.','التعرف إلى خصائص الملف.']],

const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=(p='x')=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,7);

const nl2br=s=>esc(s).replace(/\n/g,'<br>');
const lines=s=>String(s||'').split('\n').map(x=>x.trim()).filter(Boolean);
function toast(m,ms=2600){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),ms)}
function lsGet(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}

/* ===== التخزين: قاعدة بيانات claude (خاصة بكل معلم) مع بديل محلي ===== */
const Store={mode:'local',db:null,uid:null,R:{},timers:{},busy:{},pending:{},
 async init(){
  try{
   const [db,user]=await Promise.all([claude.use('db'),claude.use('user')]);
   const id=user?await user.id():null;
   if(db&&id){this.db=db;this.uid=id;this.mode='cloud';
     const col=db.collection('data/users/'+id);
     const snap=await Promise.race([col.limit(1000).get(),new Promise((_,j)=>setTimeout(()=>j(new Error('timeout')),12000))]);
     snap.docs.forEach(d=>{const v=d.data();if(v&&v.json){try{this.R[d.id]=JSON.parse(v.json)}catch(e){}}});
     // ترحيل أي بيانات محلية سابقة
     const loc=lsGet('itnb_all',null);
     if(loc&&!Object.keys(this.R).length){this.R=loc;Object.values(loc).forEach(r=>this.save(r));}
     return;
   }
  }catch(e){console.warn('db',e)}
  this.mode='local';this.R=lsGet('itnb_all',{});
 },
 get(id){return this.R[id]},
 all(kind){return Object.values(this.R).filter(r=>r.kind===kind)},
 save(rec){if(!rec.id)rec.id=uid(rec.kind||'r');rec.updated=Date.now();this.R[rec.id]=rec;
  if(this.mode==='local'){clearTimeout(this.timers._l);this.timers._l=setTimeout(()=>lsSet('itnb_all',this.R),300);return rec}
  clearTimeout(this.timers[rec.id]);this.timers[rec.id]=setTimeout(()=>this.flush(rec.id),700);return rec},
 async flush(id){
  if(this.busy[id]){this.pending[id]=1;return}
  this.busy[id]=1;
  try{const r=this.R[id];const ref=this.db.collection('data/users/'+this.uid).doc(id);
   if(!r)await ref.delete();else{const json=JSON.stringify(r);if(json.length>250000){toast('⚠️ هذا العنصر كبير جدًا للحفظ — قلّل الصور المضمّنة');}else await ref.set({kind:r.kind,json})}
  }catch(e){console.warn(e);if(e&&e.code==='quota_exceeded')toast('⚠️ امتلأت مساحة الحفظ');else if(e&&e.code==='unavailable'){setTimeout(()=>this.flush(id),1500)}}
  this.busy[id]=0;if(this.pending[id]){this.pending[id]=0;this.flush(id)}
 },
 del(id){delete this.R[id];if(this.mode==='local'){lsSet('itnb_all',this.R);return}clearTimeout(this.timers[id]);this.flush(id)}
};

/* ===== المرفقات (assets) ===== */
let ASSETS=null, DOWNLOADS=null, SAMPLE=null, SAMPLE_IMG=false;
async function uploadFiles(fileList){
 const out=[];
 for(const f of fileList){
  if(f.size>20*1024*1024){toast('الملف «'+f.name+'» أكبر من 20 م.ب');continue}
  if(ASSETS){try{const a=await ASSETS.upload(f);out.push({id:a.id,url:a.url||(blobUrl(a.id)),name:f.name,type:f.type||a.contentType||'',size:f.size})}catch(e){toast('تعذّر رفع '+f.name)}}
  else{ if(f.size>1.2*1024*1024){toast('بدون مساحة سحابية: يمكن إرفاق ملفات أصغر من 1.2 م.ب فقط');continue}
   const url=await new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(f)});out.push({id:uid('f'),url,name:f.name,type:f.type,size:f.size})}
 }
 return out;
}
async function uploadBlob(blob,name){const f=new File([blob],name,{type:blob.type});return (await uploadFiles([f]))[0]}
function blobUrl(id){return (typeof BLOB_BASE!=='undefined'?BLOB_BASE:'/_blob/')+id+(typeof BLOB_EXT!=='undefined'?BLOB_EXT:'')}
function fileUrl(f){return f.url||(blobUrl(f.id))}
function fileIcon(t=''){return t.startsWith('image')?'🖼️':t.includes('pdf')?'📕':t.startsWith('video')?'🎬':t.includes('word')||t.includes('document')?'📝':t.includes('sheet')||t.includes('excel')?'📊':t.includes('presentation')||t.includes('powerpoint')?'📽️':'📎'}
function pickFiles(accept='*/*',multiple=true){return new Promise(res=>{const i=document.createElement('input');i.type='file';i.accept=accept;i.multiple=multiple;i.onchange=()=>res([...i.files]);i.click()})}
function filesHtml(files,editable){return (files&&files.length)?`<div class="files">${files.map((f,i)=>`<span class="file">${fileIcon(f.type)}<a href="${esc(fileUrl(f))}" target="_blank" data-open="${i}">${esc(f.name)}</a>${editable?`<button data-delfile="${i}" title="حذف">✕</button>`:''}</span>`).join('')}</div>`:''}
function bindFiles(root,files,onChange){
 $$('[data-delfile]',root).forEach(b=>b.onclick=async e=>{e.preventDefault();if(!await ask('حذف هذا المرفق؟','حذف'))return;files.splice(+b.dataset.delfile,1);onChange()});
 $$('[data-open]',root).forEach(a=>a.onclick=e=>{const f=files[+a.dataset.open];if(f.type&&(f.type.startsWith('image')||f.type.startsWith('video')||f.type.includes('pdf'))){e.preventDefault();previewFile(f)}});
}
function previewFile(f){
 const u=esc(fileUrl(f));let body='';
 if(f.type.startsWith('image'))body=`<img src="${u}" style="max-width:100%">`;
 else if(f.type.startsWith('video'))body=`<video src="${u}" controls style="width:100%"></video>`;
 else if(f.type.includes('pdf')){openPdf({url:fileUrl(f),title:f.name});return}
 modal({title:f.name,body:body+`<p><a href="${u}" target="_blank">فتح في نافذة مستقلة</a></p>`,wide:true});
}
/* تأكيد بسيط داخل الصفحة (confirm محظور) */
function ask(msg,okText='تأكيد',danger=true){return new Promise(res=>{const m=modal({title:'تأكيد',body:`<p>${esc(msg)}</p>`,foot:`<button class="btn ${danger?'bad':'pri'}" data-k="ok">${esc(okText)}</button><button class="btn" data-k="no">إلغاء</button>`,onClose:()=>res(false)});
 $('[data-k=ok]',m.el).onclick=()=>{m.close(true);res(true)};$('[data-k=no]',m.el).onclick=()=>{m.close(true);res(false)}})}

/* ===== النوافذ ===== */
function modal({title,body,foot='',wide=false,onClose}){
 const bg=document.createElement('div');bg.className='modal-bg';
 bg.innerHTML=`<div class="modal ${wide?'wide':''}"><div class="mh"><h3>${esc(title)}</h3><button class="btn ghost" data-x>✕</button></div><div class="mb">${body}</div>${foot?`<div class="mf">${foot}</div>`:''}</div>`;
 document.body.appendChild(bg);
 const m={el:bg,body:$('.mb',bg),close(silent){bg.remove();if(!silent&&onClose)onClose()}};
 $('[data-x]',bg).onclick=()=>m.close();
 bg.addEventListener('mousedown',e=>{if(e.target===bg)m.close()});
 return m;
}

const kG=k=>+((/g(\d+)/.exec(String(k))||[])[1]||0),kS=k=>+((/s(\d)$/.exec(String(k))||[])[1]||1);
function myGrades(){try{const g=settings().grades;return g&&g.length?g.slice().sort((a,b)=>a-b):[1,2,3,4]}catch(e){return [1,2,3,4]}}
const KEYS=ALL_GRADES.flatMap(g=>[keyOf0(g,1),keyOf0(g,2)]);function keyOf0(g,s){return `g${g}s${s}`}
const keyOf=(g,s)=>`g${g}s${s}`;
function curr(key){
 const o=Store.get('curr_'+key);if(o)return o;
 const c=CURRICULUM[key];if(!c)return {id:'curr_'+key,kind:'curr',grade:kG(key),sem:kS(key),units:[]};
 return {id:'curr_'+key,kind:'curr',grade:c.grade,sem:c.sem,units:c.units.map(u=>({n:u.n,title:u.title,lessons:u.lessons.map(l=>({code:l[0],title:l[1],bp:l[2],gp:l[3],obj:l[4].slice(),periods:1}))}))};
}
function lessonsOf(key){return curr(key).units.flatMap(u=>u.lessons.map(l=>({...l,unit:u.title,unitN:u.n})))}
function lessonOf(key,code){return lessonsOf(key).find(l=>l.code===code)}
function lessonLabel(key,code){const l=lessonOf(key,code);return l?`${l.code} ${l.title}`:(code||'عام')}
function keyLabel(key){const g=kG(key),s=kS(key);return `الصف ${GRADE_NAMES[g]} — الفصل ${s===1?'الأول':'الثاني'}`}

function schemeBase(g){g=g||UI.grade;const s=settings(),k=grpOf(g);return k==='1-4'?(s.scheme||clone(DEFAULT_SCHEME)):(s.schemes?.[k]||clone(GROUP_SCHEMES[k]))}
function scheme(g,sem){g=g||UI.grade;const b=schemeBase(g);if(!perSem(g))return b;sem=sem||UI.sem||1;return b.map(c=>({...c,entries:c.entries.map(e=>({...e,id:e.id+'_s'+sem,sem:1}))}))}
function semCalc(st,g,sem){const S=scheme(g,sem),v=st.v||{};let t=0,h=false,M=0;S.forEach(c=>c.entries.forEach(e=>{M+=+e.max||0;const x=v[e.id];if(x!=null&&x!==''){h=true;t+=+x}}));return {t,h,pct:M?t/M*100:0}}

const allEntries=()=>scheme().flatMap(c=>c.entries.map(e=>({...e,comp:c.id})));
const schemeMax=()=>allEntries().reduce((a,e)=>a+(+e.max||0),0);
const sem1Max=()=>allEntries().filter(e=>+e.sem===1).reduce((a,e)=>a+(+e.max||0),0);
function levelOf(pct){const L=settings().levels||DEFAULT_LEVELS;for(const x of [...L].sort((a,b)=>b.min-a.min))if(pct>=x.min)return x.l;return '-'}
function studentCalc(st){
 const v=st.v||{},E=allEntries();let tot=0,s1=0,has=false,has1=false;const comp={};
 E.forEach(e=>{const x=v[e.id];if(x!=null&&x!==''){has=true;tot+=+x;comp[e.comp]=(comp[e.comp]||0)+ +x;if(+e.sem===1){s1+=+x;has1=true}}});
 const M=schemeMax(),M1=sem1Max();
 return {tot,comp,has,has1,s1,s1pct:M1?Math.round(s1/M1*100*100)/100:0,pct:M?tot/M*100:0};
}

const ASSESS_C1=`<h3>ما يخص الحلقة الأولى (الصفوف 1–4) من وثيقة تقويم تعلم الطلبة في مادة تقنية المعلومات — سبتمبر 2026</h3>
<p>هذا ملخص مستخلص من الوثيقة الكاملة (الصفوف 1–12)، والملف الكامل مرفق أعلاه لمن تريد قراءتها كاملة.</p>
<h3>أولًا: أهداف التقويم</h3><ul>
<li><b>التذكر والفهم:</b> الاسترجاع (تذكر المفاهيم والمعلومات الأساسية مثل مكونات الحاسوب وأجزائه)، والتعرف (على التقنيات والأدوات والأجهزة وأهميتها)، والتوضيح بأمثلة، واستخراج المعلومة من الرسوم والأشكال والجداول والنصوص.</li>
<li><b>التطبيق:</b> تطبيق معرفي (توظيف المعرفة في مواقف جديدة بسيطة دون استخدام فعلي للبرمجيات)، وتطبيق عملي (أداء المهارات على الحاسوب باستخدام التطبيقات المحددة، ويُقاس بالأنشطة والمشاريع بقائمة تقدير أو بطاقة ملاحظة). ويشمل: التنفيذ، والتمثيل/النمذجة، والتحديد.</li>
<li><b>الاستدلال:</b> التحليل، والتركيب/الدمج، والتقويم، واستخلاص النتائج، والتبرير.</li></ul>
<h3>ثانيًا: توزيع الدرجات على أدوات التقويم المستمر (1–4)</h3>
<table><tr><th>الأداة</th><th>الدرجة</th><th>عدد مرات التقييم الختامي</th></tr>
<tr><td>الحوار</td><td>20</td><td>4 مرات × 5 درجات</td></tr>
<tr><td>الأسئلة القصيرة</td><td>20</td><td>4 مرات × 5 درجات (خلال العام)</td></tr>
<tr><td>الأنشطة العملية</td><td>45</td><td>3 مرات × 15 درجة (3 أنشطة لـ3 وحدات مختلفة)</td></tr>
<tr><td>المشروع</td><td>15</td><td>مرة واحدة في العام (11 تطبيق + 4 استدلال)</td></tr>
<tr><th>المجموع</th><th>100</th><th></th></tr></table>
<h3>ثالثًا: الحوار (Dialogue)</h3>
<p>أداة تُطبَّق في مواقف تعليمية مختلفة للحصول على استجابات شفوية من الطلبة حول موضوع مرتبط بأهداف المنهج، بين المعلم والطالب أو بين الطلبة.</p><ul>
<li>يكون التقييم مستمرًا خلال المواقف الصفية وليس مرة واحدة، وتُرصد الدرجة الختامية وفق أداء الطالب طوال الفترة.</li>
<li>يُطبَّق ضمن نطاق مخرجات المنهج وأهدافه.</li>
<li>يُسمح للطالب بالتحاور بلغته التعبيرية الفصيحة بشرط دقة المفهوم واستخدام المصطلحات التقنية الصحيحة.</li>
<li>يقدم المعلم تغذية راجعة فورية ومباشرة بعد الحوار.</li>
<li>يمكن للمعلم تصميم استمارته الخاصة لمتابعة طلبته، ولا يلزم إضافتها في سجل الدرجات.</li>
<li>لا تُمنح درجة الحوار أو يُحرم منها الطالب بناءً على سلوكه أو حضوره أو إعداد الوسائل.</li></ul>
<table><tr><th>المعايير</th><th>مستوى التقدير</th><th>الدرجة (1–4)</th></tr>
<tr><td rowspan="5">• يقدم إجابات بلغة واضحة وسهلة الاستيعاب.<br>• إجاباته مباشرة ومرتبطة بالسؤال دون خروج عن الموضوع.<br>• يقدم معلومات صحيحة ويستخدم المصطلحات التقنية المناسبة بدقة وفي سياقها.<br>• يُظهر تفاعلًا جيدًا وثقة أثناء حديثه.</td><td>دائمًا</td><td>5</td></tr>
<tr><td>غالبًا</td><td>4</td></tr><tr><td>أحيانًا</td><td>3</td></tr><tr><td>قليلًا</td><td>2</td></tr><tr><td>نادرًا</td><td>1</td></tr></table>
<h3>رابعًا: السؤال القصير (Quiz)</h3><ul>
<li>يُستخدم أثناء الحصة للتأكد من اكتساب الطالب للمعارف والمهارات، ويتكون من سؤال أو سؤالين كحد أقصى.</li>
<li>يقيس 3 مخرجات كحد أقصى مرتبطة مباشرة بالحصة السابقة أو الحالية.</li>
<li>يمكن الاستعانة بأفكار تدريبات الكتاب المدرسي مع مراعاة المواصفات الفنية.</li>
<li>يجيب عنه الطالب كتابيًا، ولا يزيد زمنه عن 10 دقائق، مع تغذية راجعة فورية بعد التصحيح.</li>
<li>يُطبَّق أربع مرات خلال العام الدراسي للصفوف (1–4) بواقع 5 درجات لكل سؤال قصير.</li></ul>
<table><tr><th>الصفان</th><th>السؤال</th><th>نوع السؤال</th><th>الهدف التقويمي</th><th>المفردات</th><th>الدرجة</th></tr>
<tr><td rowspan="2">1 و2</td><td>1</td><td>مطابقة</td><td>تذكر وفهم</td><td>3 مفردات (درجة لكل مفردة)</td><td>3</td></tr>
<tr><td>2</td><td>صح وخطأ، أو نعم/لا مع التفسير البسيط</td><td>استدلال</td><td>مفردتان (درجة لكل مفردة)</td><td>2</td></tr>
<tr><td rowspan="2">3 و4</td><td>1</td><td>اختيار من متعدد (4 بدائل)</td><td>تذكر وفهم</td><td>3 مفردات (درجة لكل مفردة)</td><td>3</td></tr>
<tr><td>2</td><td>صح وخطأ مع تصحيح الخطأ، أو نعم/لا مع التفسير، أو مقالي/إجابة قصيرة</td><td>استدلال</td><td>مفردة واحدة بدرجتين</td><td>2</td></tr></table>
<h3>خامسًا: النشاط العملي (Practical Activity)</h3>
<p>أداة لقياس تعلم الطالب وتطوير مهاراته بتطبيق معرفته في سياقات واقعية، ينفذها عمليًا وحده أو بالتعاون مع معلمه وزملائه.</p><ul>
<li>يُصمَّم بما يحقق مخرجًا أو أكثر من مخرجات الموضوع أو الوحدة.</li>
<li>يمكن الاستفادة من تدريبات الكتاب في نهاية كل وحدة مع مراعاة ضوابط الوثيقة.</li>
<li>تُعد استمارة مفصلة بجميع المهام المطلوبة ودرجة كل مهمة حسب وزنها ودرجة تعقيدها.</li>
<li>تُعرض استمارة النشاط على المشرف لمراجعتها قبل التطبيق.</li>
<li>ينفذ الطلبة النشاط فرديًا في الصف أثناء الحصة، مع التوجيه والدعم المستمر من المعلم للصفوف (1–4).</li>
<li><b>آلية التقييم:</b> تُعد خطة لتقييم 3 وحدات مختلفة (3 أنشطة مختلفة) خلال العام، وتُرصد 45 درجة: ثلاث مرات بواقع 15 درجة لكل مرة.</li></ul>
<h3>سادسًا: المشروع (Project)</h3>
<p>أداة تعتمد على العمل الإجرائي المهاري والاستقصاء للوصول إلى منتج أو نتائج، وتنمي التفكير الناقد والإبداع في إنتاج الأفكار والحلول الرقمية.</p><ul>
<li>يرتبط المشروع ارتباطًا مباشرًا بأهداف المنهج ومخرجاته.</li>
<li>يُقيَّم الطالب على المراحل العملية والمنتج النهائي معًا، لا المنتج النهائي فقط.</li>
<li>تُطرح على الطالب أسئلة عن مشروعه للتأكد من درايته بمحتواه وأنه من عمله.</li>
<li>يُطبَّق مشروع واحد فقط خلال العام من 15 درجة (11 للتطبيق و4 للاستدلال).</li>
<li><b>الصفان 1 و2:</b> يُقيَّم المشروع المدرج في الكتاب (الفصل الدراسي الثاني) وتُرصد له 15 درجة، مع الالتزام بمعايير تقييم المشاريع في ملحق الوثيقة.</li>
<li><b>الصفان 3 و4:</b> يُقيَّم أحد المشروعين المدرجين في الكتاب ختاميًا (مشروع الفصل الأول أو الثاني) بـ15 درجة، ويُقيَّم المشروع الآخر تكوينيًا دون رصد درجة.</li>
<li>الوحدة التي تُقيَّم بالمشروع لا تُقيَّم بالأنشطة العملية.</li>
<li>يوجّه المعلم الخطوات ويوثّق مراحل العمل، ويُنفَّذ المشروع أثناء الحصة مع مناقشة الطالب فيه.</li></ul>
<h3>سابعًا: التقويم الإلكتروني ومهارات المستقبل</h3><ul>
<li>يمكن تطبيق بعض أدوات التقويم إلكترونيًا عبر المنصات التعليمية المعتمدة حسب إمكانية المدرسة، أو ورقيًا مثل الأسئلة القصيرة داخل الصف.</li>
<li>تُضمَّن مهارات المستقبل (الأساسية، والتطبيقية كالإبداع والتفكير الناقد وحل المشكلات والتواصل والعمل الجماعي، والتقنية) في أدوات التقويم بمؤشرات واضحة لقياسها.</li></ul>
<h3>ثامنًا: استمارة رصد ومتابعة أداء الطلبة (1–4)</h3>
<p>الحوار (5+5+5+5 = 20) · الأسئلة القصيرة (5+5+5+5 = 20) · الأنشطة العملية (15+15+15 = 45) · المشروع (15) · المجموع 100 — وهي نفسها المطبقة في «سجل الدرجات» في المفكرة.</p>`;

function newPrep(key,code){

 const p={id:uid('prep'),kind:'prep',key,code,title:'التحضير 1',created:Date.now(),sessions:[],files:[],f:{}};
 PREP_F.forEach(([k])=>p.f[k]='');
 p.f.obj=l?l.obj.map((o,i)=>`${i+1}. ${o}`).join('\n'):'';

 const same=Store.all('prep').filter(x=>x.key===key&&x.code===code).length;p.title='التحضير '+(same+1);
 return p;
}

function rcRec(){return Store.get('ready_custom')||{id:'ready_custom',kind:'rc',add:{},hide:{}}}

 Object.entries(base).forEach(([c,r])=>{if(!H.includes(c))out[c]=r});Object.entries(rc.add[key]||{}).forEach(([c,r])=>{out[c]=r});return out}

 const prepsByDay={};Store.all('prep').forEach(p=>(p.sessions||[]).forEach(s=>{if(s.date)(prepsByDay[s.date]=prepsByDay[s.date]||[]).push(`${s.cls||''} ${p.code}`)}));
 let h='';const start=sundayOf(F),end=new Date(T);end.setDate(end.getDate()+(6-end.getDay()));
 for(let dt=new Date(start);dt<=end;dt.setDate(dt.getDate()+1)){
  const ds=ymd(dt),out=dt<F||dt>T;
  if(out&&pad==='empty'){h+=`<div class="cday empty"></div>`;continue}
  const wd=dt.getDay(),ev=calDayEvents(c,ds),pp=prepsByDay[ds]||[];
  const lbl=pad==='empty'?dt.getDate():`${dt.getDate()}${dt.getDate()===1||ds===ymd(start)?' '+MONTHS[dt.getMonth()]:''}`;
  h+=`<div class="cday ${wd>=5?'we':''} ${ds===today?'today':''} ${out?'out':''}"><div class="cnum" data-wd="${AR_DAYS[wd]}">${lbl}</div><div class="cevs">${ev.map(({e,k})=>`<span class="cev ${k}" style="--ec:${tc(e.c)}" title="${esc(e.t)}">${k==='start'?'▶ ':k==='end'?'◀ ':''}${esc(e.s)}${k==='end'?' (نهاية)':''}</span>`).join('')}${pp.map(x=>`<span class="cev prep">📝 ${esc(x)}</span>`).join('')}</div>

 return h;
}

const AR2EN=s=>String(s||'').replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d));
function secGrade(sec){const s=AR2EN(sec);const W=[[/حادي\s*عشر/,11],[/ثاني\s*عشر/,12],[/عاشر/,10],[/تاسع/,9],[/ثامن/,8],[/سابع/,7],[/سادس/,6],[/خامس/,5],[/رابع/,4],[/ثالث/,3],[/ثاني|ثان/,2],[/أول|اول/,1]];for(const [r,g] of W)if(r.test(s))return g;let m=s.match(/(\d{1,2})\s*[\/\-\.]/);if(m&&+m[1]>=1&&+m[1]<=12)return +m[1];m=s.match(/\d+/);return m&&+m[0]>=1&&+m[0]<=12?+m[0]:0}
function curSem(){const s=settings();const t=ymd(new Date());return s.start?.[2]&&t>=s.start[2]?2:1}
function progRec(){return Store.get('progress')||{id:'progress',kind:'prog',done:{}}}
function secDone(sec,key){return (progRec().done[sec]||{})[key]||[]}
function secNext(sec){const g=secGrade(sec);if(!g)return null;const key=keyOf(g,curSem());const d=secDone(sec,key);const L=lessonsOf(key);return {key,lesson:L.find(l=>!d.includes(l.code))||null,doneN:d.length,total:L.length}}
function markDone(sec,key,code,on=true){const r=progRec();r.done[sec]=r.done[sec]||{};const a=r.done[sec][key]=r.done[sec][key]||[];const i=a.indexOf(code);if(on&&i<0)a.push(code);if(!on&&i>=0)a.splice(i,1);Store.save(r);
 if(on){const p=Store.all('prep').filter(x=>x.key===key&&x.code===code).sort((a,b)=>b.created-a.created)[0];if(p&&!p.done){p.done=true;Store.save(p)}}}
function weekStart(str){const m=AR2EN(str).match(/(\d+)\s*-\s*\d+\s*\/\s*(\d+)\s*\/\s*(\d{4})/);return m?new Date(+m[3],+m[2]-1,+m[1]):null}
function expectedLesson(key){try{const p=plan(key);const now=new Date();let w=-1;p.weeks.forEach((x,i)=>{const d=weekStart(x.date);if(d&&d<=now)w=i});if(w<0)return null;
 const LS=lessonSlots(p),slot=w*p.spw+p.spw-1;let li=LS.findIndex(([a,b])=>slot>=a&&slot<b);if(li<0)li=LS.length-1;const L=lessonsOf(key);const t=p.lessons[li]?.title;
 const byT=L.findIndex(l=>l.title===t);const idx=byT>=0?byT:Math.min(li,L.length-1);return {idx,lesson:L[idx]}}catch(e){return null}}
function openLessonPrep(key,code,re){
 let p=Store.all('prep').filter(x=>x.key===key&&x.code===code).sort((a,b)=>b.created-a.created)[0];
 if(!p){p=newPrep(key,code);const R=readySet(key)[code];if(R){Object.assign(p.f,clone(R.f));const o=readyObj(key,code);if(o)p.f.obj=o;p.title='التحضير الجاهز'}Store.save(p)}
 prepEditor(p,re)}

function shrinkImg(src,max=420,q=.62){return new Promise(res=>{const im=new Image();im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.max(1,Math.round(im.width*k));c.height=Math.max(1,Math.round(im.height*k));const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);const d=c.toDataURL('image/jpeg',q);res(d.length<src.length?d:src)};im.onerror=()=>res(src);im.src=src})}
function b64u(u8){let s='';for(let i=0;i<u8.length;i+=0x8000)s+=String.fromCharCode.apply(null,u8.subarray(i,i+0x8000));return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}

 const big=[...new Set(h.match(/data:image\/[a-z+]+;base64,[A-Za-z0-9+/=]{12000,}/g)||[])];
 for(const d of big){const sm=await shrinkImg(d);if(sm!==d)h=h.split(d).join(sm)}
 const raw=new TextEncoder().encode(h);let tag='z',bytes=raw;
 try{bytes=new Uint8Array(await new Response(new Blob([raw]).stream().pipeThrough(new CompressionStream('deflate-raw'))).arrayBuffer())}catch(e){tag='u';bytes=raw}
 return new URL('play.html',location.href).href.split('#')[0]+'#'+tag+'='+b64u(bytes)}

function snd(ok){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();const t=ac.currentTime;(ok?[523,659,784]:[220,180]).forEach((f,k)=>{const o=ac.createOscillator(),g=ac.createGain();o.type=ok?'triangle':'sawtooth';o.frequency.value=f;g.gain.setValueAtTime(.0001,t+k*.12);g.gain.exponentialRampToValueAtTime(.25,t+k*.12+.02);g.gain.exponentialRampToValueAtTime(.0001,t+k*.12+.25);o.connect(g);g.connect(ac.destination);o.start(t+k*.12);o.stop(t+k*.12+.3)})}catch(e){}}

/* ===== استخراج ملفات الوزارة من Google Drive داخل المفكرة ===== */
let MCP=null;const GD='Google Drive';
function gdErr(e){const c=e&&e.code;if(c==='server_not_connected'||c==='selection_required')return 'اربطي Google Drive بحسابك في Claude: الإعدادات ← الموصلات ← Google Drive، ثم أعيدي المحاولة.';
 if(c==='needs_reauth')return 'أعيدي ربط Google Drive من إعدادات Claude ← الموصلات.';if(c==='not_in_manifest'||c==='approval_required'||c==='consent_required')return 'يلزم السماح للمفكرة باستخدام Google Drive — اضغطي «سماح» عند ظهور الطلب.';
 if(c==='server_unavailable')return 'Google Drive لا يستجيب الآن، حاولي بعد قليل.';if(c==='not_granted'||c==='capability_disabled')return 'الاستخراج من Drive يعمل عند فتح المفكرة داخل Claude.';return 'تعذّر الوصول إلى الملف'+(e&&e.message?': '+String(e.message).slice(0,120):'')}
async function gdList(id){const r=await MCP.callTool(GD,'search_files',{query:`parentId = '${id}'`,excludeContentSnippets:true,pageSize:200});let p=r.payload;if(typeof p==='string'){try{p=JSON.parse(p)}catch(e){p={}}}return ((p&&p.files)||[]).sort((a,b)=>(b.mimeType.includes('folder')-a.mimeType.includes('folder'))||a.title.localeCompare(b.title,'ar',{numeric:true}))}
async function gdBlob(id,nameHint){const r=await MCP.callTool(GD,'download_file_content',{fileId:id});let p=r.payload;if(typeof p==='string'){try{p=JSON.parse(p)}catch(e){}}
 const b64=p&&(p.content||p.data||p.base64);if(!b64)throw {message:'لم يصل محتوى الملف'};const bin=atob(b64);const u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);
 let name=(p.title||nameHint||'ملف');const type=p.mimeType||'application/octet-stream';if(type==='application/pdf'&&!/\.pdf$/i.test(name))name+='.pdf';return {blob:new Blob([u],{type}),name,type}}
const MB=n=>(n/1048576).toFixed(n>10485760?0:1)+' م.ب';
const gdIcon=t=>t.includes('folder')?'📁':t.includes('pdf')?'📕':t.startsWith('image')?'🖼️':t.startsWith('video')?'🎬':t.includes('presentation')||t.includes('powerpoint')?'📊':t.includes('sheet')||t.includes('excel')?'📗':t.includes('word')||t.includes('document')?'📘':t.includes('zip')||t.includes('compressed')?'🗜️':'📄';
async function withFile(id,name,size,fn,btn){if(size&&+size>45*1048576&&!await ask(`حجم الملف ${MB(+size)} وقد يستغرق وقتًا طويلًا أو لا يكتمل. متابعة؟`,'متابعة',false))return;
 const t=btn&&btn.innerHTML;if(btn){btn.disabled=true;btn.innerHTML='<span class="spin"></span>'}toast('جارٍ الاستخراج من Drive…');
 try{const f=await gdBlob(id,name);await fn(f)}catch(e){console.warn(e);modal({title:'تعذّر الاستخراج',body:`<p>${esc(gdErr(e))}</p>`})}if(btn){btn.disabled=false;btn.innerHTML=t}}
function gdView(f){const url=URL.createObjectURL(f.blob);if(f.type==='application/pdf')return openPdf({url,title:f.name,page:1,off:0});
 if(f.type.startsWith('image'))return modal({title:f.name,wide:true,body:`<img src="${url}" style="width:100%;border-radius:10px">`});
 if(f.type.startsWith('video'))return modal({title:f.name,wide:true,body:`<video src="${url}" controls style="width:100%;border-radius:10px"></video>`});
 if(f.type.startsWith('text'))return f.blob.text().then(t=>modal({title:f.name,wide:true,body:`<pre style="white-space:pre-wrap">${esc(t.slice(0,20000))}</pre>`}));
 toast('لا يمكن عرض هذا النوع داخل المفكرة — سيُنزَّل');return saveFile(f.name,f.blob)}
async function gdShare(f){const file=new File([f.blob],f.name,{type:f.type});try{if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:f.name});return}}catch(e){if(e&&e.name==='AbortError')return}toast('الإرسال المباشر غير مدعوم هنا — سيُنزَّل الملف لترسليه');await saveFile(f.name,f.blob)}
function moeSavedRec(){return Store.get('moe_saved')||{id:'moe_saved',kind:'moe',files:[]}}
async function gdSave(f,g,sem,slot){if(f.blob.size>20*1048576){toast('الملف أكبر من 20 م.ب — لا يمكن حفظه داخل المفكرة، استخدمي ⬇️ تنزيل');return}
 toast('جارٍ الحفظ في المفكرة…');const u=await uploadBlob(f.blob,f.name);if(!u)return;u.name=f.name;
 if(slot){const s=settings();s.books=s.books||{};s.books[slot]={...u,off:0};saveSettings(s);toast('✔ أصبح الكتاب داخل المفكرة')}
 else{libAddFile(u,g,sem);toast('✔ أُضيف إلى المكتبة ← الملفات (الصف '+(GRADE_NAMES[g]||'')+')')}

function gdFileBtns(id,name,size,g,sem,slot){return `<span class="row" style="gap:4px;flex-wrap:nowrap"><button class="btn sm" data-gv="${id}" data-n="${esc(name)}" data-z="${size||''}" title="عرض">👁️</button><button class="btn sm" data-gd="${id}" data-n="${esc(name)}" data-z="${size||''}" title="تنزيل">⬇️</button><button class="btn sm" data-gk="${id}" data-n="${esc(name)}" data-z="${size||''}" data-g="${g||''}" data-s="${sem||''}" data-slot="${slot||''}" title="${slot?'جعله كتاب المفكرة':'حفظ في المكتبة'}">📥</button></span>`}
function bindGdBtns(root){
 $$('[data-gv]',root).forEach(b=>b.onclick=()=>withFile(b.dataset.gv,b.dataset.n,b.dataset.z,gdView,b));
 $$('[data-gd]',root).forEach(b=>b.onclick=()=>withFile(b.dataset.gd,b.dataset.n,b.dataset.z,f=>saveFile(f.name,f.blob),b));

 $$('[data-gk]',root).forEach(b=>b.onclick=()=>withFile(b.dataset.gk,b.dataset.n,b.dataset.z,f=>gdSave(f,+b.dataset.g||null,+b.dataset.s||null,b.dataset.slot||null),b));

function moeBrowse(id,title,g,sem){const stack=[[id,title]];const m=modal({title:'📁 '+title,wide:true,body:`<div id="gdc" class="small muted" style="margin-bottom:8px"></div><div id="gdl"></div>`});
 const load=async()=>{const [cid,ct]=stack[stack.length-1];$('#gdc',m.el).innerHTML=stack.map(([i,t],k)=>k<stack.length-1?`<a href="#" data-bk="${k}">${esc(t)}</a> ‹ `:`<b>${esc(t)}</b>`).join('');
  $$('[data-bk]',m.el).forEach(a=>a.onclick=e=>{e.preventDefault();stack.length=+a.dataset.bk+1;load()});
  $('#gdl',m.el).innerHTML='<div class="empty small"><span class="spin"></span> جارٍ القراءة من Drive…</div>';
  try{const L=(await gdList(cid)).filter(f=>!/^thumbs\.db$/i.test(f.title));
   const fl=L.filter(f=>!f.mimeType.includes('folder'));$('#gdl',m.el).innerHTML=(fl.length>1?`<div class="row" style="justify-content:flex-end;margin-bottom:6px"><button class="btn sm pri" id="gdAll">📥 حفظ كل الملفات في المكتبة</button></div>`:'')+(L.length?L.map(f=>{const fo=f.mimeType.includes('folder');return `<div class="moei">${fo?`<a href="#" data-in="${f.id}" data-n="${esc(f.title)}" style="flex:1;text-decoration:none;color:inherit">📁 <b>${esc(f.title)}</b></a><span class="small muted">فتح ‹</span>`:`<span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis">${gdIcon(f.mimeType)} ${esc(f.title)} <small class="muted">${f.fileSize?MB(+f.fileSize):''}</small></span>${gdFileBtns(f.id,f.title,f.fileSize,g,sem)}`}</div>`}).join(''):'<div class="empty small">المجلد فارغ.</div>');$('#gdAll',m.el)&&($('#gdAll',m.el).onclick=e=>gdSaveAll(fl,g,sem,e.target));

function libAddFile(u,g,sem){g=g||kG(curKey());Store.save({id:uid('item'),kind:'item',lib:'files',sub:'file',key:'g'+g+'s'+(sem||1),code:'',scope:'general',title:(u.name||'ملف').replace(/\.[^.]+$/,''),body:'وزارة التعليم — Google Drive',steps:[],materials:[],objectives:[],links:[],files:(u.type||'').startsWith('image')?[]:[u],images:(u.type||'').startsWith('image')?[u]:[],quiz:[],created:Date.now(),src:'moe'})}

/* ===== نسخة GitHub المستقلة: تخزين على الجهاز (IndexedDB) + مساعد Gemini + تثبيت كتطبيق ===== */
const STANDALONE=true;SAMPLE_IMG=true;
const IDB={db:null,
 open(){return this.db?Promise.resolve(this.db):new Promise((ok,no)=>{const r=indexedDB.open('dafter',1);r.onupgradeneeded=()=>{const d=r.result;d.createObjectStore('kv');d.createObjectStore('files')};r.onsuccess=()=>{this.db=r.result;ok(this.db)};r.onerror=()=>no(r.error)})},
 async tx(store,mode,fn){const d=await this.open();return new Promise((ok,no)=>{const t=d.transaction(store,mode);const s=t.objectStore(store);const q=fn(s);t.oncomplete=()=>ok(q&&q.result);t.onerror=()=>no(t.error)})},
 get(store,k){return this.tx(store,'readonly',s=>s.get(k))},
 set(store,k,v){return this.tx(store,'readwrite',s=>s.put(v,k))},
 del(store,k){return this.tx(store,'readwrite',s=>s.delete(k))},
 async all(store){const d=await this.open();return new Promise((ok,no)=>{const out={};const t=d.transaction(store,'readonly');const c=t.objectStore(store).openCursor();c.onsuccess=()=>{const x=c.result;if(x){out[x.key]=x.value;x.continue()}};t.oncomplete=()=>ok(out);t.onerror=()=>no(t.error)})}};
const FILE_URLS={};
/* --- البيانات --- */
Store.init=async function(){this.mode='local';
 try{const r=await IDB.get('kv','all');if(r)this.R=r;else{this.R=lsGet('itnb_all',{});if(Object.keys(this.R).length)await IDB.set('kv','all',this.R)}
  const F=await IDB.all('files');Object.entries(F).forEach(([id,b])=>{FILE_URLS[id]=URL.createObjectURL(b)});
  try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}}
 catch(e){console.warn(e);this.R=lsGet('itnb_all',{})}};
Store._persist=function(){clearTimeout(this.timers._l);this.timers._l=setTimeout(()=>{IDB.set('kv','all',this.R).catch(e=>{console.warn(e);lsSet('itnb_all',this.R)})},300)};
Store.save=function(rec){if(!rec.id)rec.id=uid(rec.kind||'r');rec.updated=Date.now();this.R[rec.id]=rec;this._persist();return rec};
Store.del=function(id){delete this.R[id];this._persist()};

ASSETS={async upload(f){const id=uid('f');await IDB.set('files',id,f);FILE_URLS[id]=URL.createObjectURL(f);return {id,url:'idb:'+id,contentType:f.type}}};
function fileUrl(f){if(!f)return '';if(f.url&&String(f.url).startsWith('idb:'))return FILE_URLS[f.id]||FILE_URLS[String(f.url).slice(4)]||'';return f.url||blobUrl(f.id)}

 for(const [id,b] of Object.entries(F)){files[id]={type:b.type,name:b.name||'',data:await new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(b)})}}
 return JSON.stringify({__dafter:2,records:Store.R,files})}
async function restoreBackup(text){const d=JSON.parse(text);const recs=d&&d.__dafter?d.records:d;

 Object.values(recs||{}).forEach(r=>r&&r.id&&Store.save(r))}

const GKEY=()=>lsGet('itnb_gkey','');
async function gModel(key){const c=lsGet('itnb_gmodel2',null);if(c&&c.k===key.slice(-6)&&Date.now()-c.t<3*864e5)return c;
 let m='gemini-2.5-flash',lite='gemini-2.5-flash-lite';
 try{const r=await fetch('https://generativelanguage.googleapis.com/v1beta/models?pageSize=200',{headers:{'x-goog-api-key':key}});if(r.ok){const j=await r.json();
  const all=(j.models||[]).filter(x=>(x.supportedGenerationMethods||[]).includes('generateContent')).map(x=>x.name.replace('models/',''));
  const pick=re=>all.filter(n=>re.test(n)).sort((a,b)=>parseFloat(b.split('-')[1])-parseFloat(a.split('-')[1]))[0];
  m=pick(/^gemini-\d+(\.\d+)?-flash$/)||m;lite=pick(/^gemini-\d+(\.\d+)?-flash-lite$/)||lite}}catch(e){}
 const o={k:key.slice(-6),m,lite,t:Date.now()};lsSet('itnb_gmodel2',o);return o}
// طلب واحد في كل مرة — الضغط على عدة أزرار معًا يتجاوز حد الدقيقة المجاني
let _gq=Promise.resolve();function gQueue(fn){const r=_gq.then(fn,fn);_gq=r.catch(()=>{});return r}
const b64=b=>new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(String(fr.result).split(',')[1]);fr.readAsDataURL(b)});
SAMPLE=(input,opts={})=>gQueue(()=>gRun(input,opts));
async function gRun(input,opts){const key=GKEY();
 if(!key){gKeyDialog();const e=new Error('أضف مفتاح Gemini أولًا (مرة واحدة فقط)');e.code='no_key';throw e}
 // المحادثة: تحويل الرسائل إلى صيغة Gemini (user/model) بدل إرسالها كنص واحد
 const msgs=Array.isArray(input)?input:[{role:'user',content:String(input)}];
 const contents=msgs.map(m=>({role:m.role==='assistant'?'model':'user',parts:[{text:String(m.content??'')}]}));
 const first=contents.find(c=>c.role==='user')||contents[0];
 for(const im of (opts.images||[]).slice(0,6))first.parts.push({inline_data:{mime_type:im.type||'image/jpeg',data:await b64(im)}});
 const M=await gModel(key);const models=[M.m];if(M.lite&&M.lite!==M.m)models.push(M.lite);
 const send=(model,tc)=>fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:streamGenerateContent?alt=sse`,{method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':key},body:JSON.stringify({contents,generationConfig:Object.assign({temperature:.7},tc?{thinkingConfig:tc}:{})})});
 const sleep=ms=>new Promise(r=>setTimeout(r,ms));
 let r=null,lastMsg='',daily=false;
 for(const model of models){
  // إيقاف «التفكير» الطويل في نماذج Flash — هو السبب الأكبر للبطء
  const think=/^gemini-2\.5-flash/.test(model)?{thinkingBudget:0}:/^gemini-[3-9]/.test(model)?{thinkingLevel:'minimal'}:null;
  for(let tries=0;tries<3;tries++){
   r=await send(model,think);
   if(!r.ok&&r.status===400&&think)r=await send(model,null);
   if(r.status!==429)break;
   let body={};try{body=(await r.json()).error||{}}catch(_){}lastMsg=body.message||'';
   const perDay=/per.?day|PerDay|daily/i.test(lastMsg+JSON.stringify(body.details||''));if(perDay){daily=true;break}
   // حد الدقيقة: ننتظر المدة التي يطلبها Google ثم نعيد تلقائيًا
   const rd=(body.details||[]).map(d=>d.retryDelay).find(Boolean);let w=rd?Math.ceil(parseFloat(rd)):15;w=Math.min(Math.max(w,3),40);
   if(tries===2)break;try{toast('المساعد مزدحم قليلًا… سأعيد المحاولة تلقائيًا بعد '+w+' ثانية')}catch(_){}
   await sleep(w*1000+300)}
  if(r.ok)break;if(r.status!==429)break}
 if(!r.ok){let msg=lastMsg;if(r.status!==429){try{msg=(await r.json()).error.message||''}catch(_){}}
  const e=new Error(r.status===429?(daily?'انتهت الطلبات المجانية لهذا اليوم في مفتاح Gemini — تتجدد يوميًا قرابة الظهر بتوقيت الخليج':'المساعد مزدحم الآن — حاول بعد دقيقة'):(r.status===400||r.status===403)&&/key|API_KEY|permission/i.test(msg)?'مفتاح Gemini غير صحيح — راجعه في الإعدادات':'تعذّر الاتصال بالمساعد ('+r.status+')');
  e.code=r.status===429?'rate_limited':'gemini';if(r.status===404)lsSet('itnb_gmodel2',null);throw e}
 // البث: يظهر النص أولًا بأول بدل انتظار الإجابة كاملة
 let text='',buf='';const rdr=r.body.getReader(),dec=new TextDecoder();
 const eat=line=>{line=line.trim();if(!line.startsWith('data:'))return;try{const j=JSON.parse(line.slice(5));const t=((j.candidates||[])[0]?.content?.parts||[]).filter(p=>!p.thought).map(p=>p.text||'').join('');if(t){text+=t;if(opts.onText)try{opts.onText({text})}catch(_){}}}catch(_){}};
 for(;;){const {done,value}=await rdr.read();if(done)break;buf+=dec.decode(value,{stream:true});let i;while((i=buf.indexOf('\n'))>=0){eat(buf.slice(0,i));buf=buf.slice(i+1)}}
 eat(buf);
 if(!text){const e=new Error('لم يُرجع المساعد نصًا — أعيدي المحاولة');e.code='gemini';throw e}
 return {text}}

async function lessonImages(key,code,{book=true,guide=true,gpages=1}={}){
 if(!SAMPLE_IMG||!code)return [];
 const l=lessonOf(key,code);if(!l)return [];
 const out=[];out.meta=[];const list=[];
 if(book)list.push(['book_'+key,l.bp],['book_'+key,l.bp+1]);
 if(guide)for(let k=0;k<gpages;k++)list.push(['guide_'+key,l.gp+k]);
 // الصفحات تُجهَّز معًا وتُحفظ في الذاكرة، فلا يُعاد رسمها مع كل طلب
 const bl=await Promise.all(list.map(([bk,p])=>pageBlob(bk,p)));

}
function fixJSONStr(j){let o='',q=false,e=false;for(const ch of j){if(q){if(e){o+=ch;e=false;continue}if(ch==='\\'){o+=ch;e=true;continue}if(ch==='"'){q=false;o+=ch;continue}if(ch==='\n'){o+='\\n';continue}if(ch==='\r')continue;if(ch==='\t'){o+='\\t';continue}o+=ch}else{if(ch==='"')q=true;o+=ch}}return o}
function parseJSON(t){t=String(t||'').replace(/```json|```/g,'');const a=t.indexOf('{'),b=t.lastIndexOf('}');if(a<0||b<a)throw new Error('لم يُرجع المساعد نتيجة مفهومة — أعيدي المحاولة');const j=t.slice(a,b+1);try{return JSON.parse(j)}catch(_){try{return JSON.parse(fixJSONStr(j).replace(/,\s*([}\]])/g,'$1'))}catch(e){throw new Error('لم يُرجع المساعد نتيجة مفهومة — أعيدي المحاولة')}}}
const CROP_HINT=meta=>meta&&meta.length?`\nالصور المرفقة مرقّمة بالترتيب: ${meta.map(([bk,p],k)=>`${k+1} = ${bk.startsWith('book')?'كتاب التلميذ':'دليل المعلم'} صفحة ${p}`).join('، ')}.

async function bookCrops(meta,crops){const cache={},out={};
 for(const c of crops||[]){try{const m=meta&&meta[(+c.img||1)-1];if(!m||!Array.isArray(c.box)||c.box.length<4)continue;const k=m.join(':');
  const cv=cache[k]||(cache[k]=await renderPage(m[0],m[1],2.4));let [x,y,w,h]=c.box.map(Number);const pd=1.5;x=Math.max(0,x-pd);y=Math.max(0,y-pd);w=Math.min(100-x,w+2*pd);h=Math.min(100-y,h+2*pd);if(w<2||h<2)continue;
  const W=cv.width,H=cv.height,o=document.createElement('canvas');o.width=Math.round(w/100*W);o.height=Math.round(h/100*H);o.getContext('2d').drawImage(cv,x/100*W,y/100*H,o.width,o.height,0,0,o.width,o.height);
  const b=await new Promise(r=>o.toBlob(r,'image/jpeg',.9));const f=b&&await uploadBlob(b,'book-crop.jpg');if(f)out[c.id]=f}catch(e){console.warn(e)}}
 return out}

}
